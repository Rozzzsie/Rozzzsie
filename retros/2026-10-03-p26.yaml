instrument_liveness:
  silent_failures_observed: 7
  caught_by_control: 1
  caught_by_review: 4
  caught_by_contradiction: 2
  notes: >-
    Hand-classified; the three arms sum to the total. The control catch: a search that never
    ran, because the shell expanded its file pattern first, was re-run with the pattern quoted
    and a known file as control. The four review catches:
    - a helper checked a prompt patch at its artifact and found it gone;
    - a helper found the roster mirror short a member;
    - a helper found that a recorded baseline of zero sites for a code pattern was wrong, with
      three sites present;
    - a pass result read from a piped command was the pipe's exit code, not the search's, and
      was re-run without the pipe.
    The two contradiction catches:
    - the operator knew the learning agent had run while the dashboard said zero (finding 1);
    - a hook's source writes a record on every run while the log holds none for it (finding 2).

