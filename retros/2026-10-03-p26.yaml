retro_id: '2026-10-03-p26'
retro_date: '2026-10-03'
prior_retro: '2026-09-27-p25'
schema_version: '1.1'
window_start: '2026-09-27'
window_end: '2026-10-03'
trigger_source: operator-requested-one-day-early-interactive-with-first-monthly-housecleaning
interactive_mode: true

meta_finding: >-
  Two of this cycle's sharpest findings were about records that never existed, and nothing
  reports a record that was never written. The public dashboard's learning-agent count placed
  each run by the date its transcript file was last written, in UTC, so every retro's own run
  was counted a week late, and last cycle published zero for a week in which it had run. The
  operator caught that by knowing the run had happened. Separately, four hooks call a logging
  function that was never defined, and an error suppression on the call hid it, so three of
  them have never appeared in the hook audit at all. The audit lists hooks by the records it
  finds, so their absence read as nothing to report. The recurring gap classes from last cycle
  grew, except one: the habit whose capability was removed by a setting fell from eleven
  instances to five, and the one attempt after the guard went live was blocked. Removing a
  capability worked where adding wording had not.

findings:
  - id: p26-1
    title: The learning-agent count placed each run by its transcript file's UTC date, so every retro's own run was counted a week late
    category: instrument-validity
    evidence_count: 2
    source_catchment: the operator's question about last cycle's zero, traced to the tally script's window test
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-11'
    target_surface: the sidecar metrics tally's window test
    detail_ref: >-
      The tally decides whether a session belongs to the week by the date its transcript file was
      last written, in UTC, not by when each call happened. The retro runs in the operator's
      evening, which is already the next day in UTC. Last cycle's window ended the day before
      the retro ran, so its own learning-agent run fell outside and the dashboard published
      zero. This cycle's figure of 1 is last cycle's run. Tonight's run will be counted next
      cycle. The same test places every agent in the dispatch distribution, not only this one.
      The operator chose to publish tonight's figure with this note and fix the script in a
      later build session, rather than change the counting rule mid-ritual. Caught by the
      operator, who knew the run had happened.

  - id: p26-2
    title: Four hooks call a logging function that was never defined, so three of them have never appeared in the hook audit
    category: instrument-validity
    evidence_count: 4
    source_catchment: reading a hook's source while checking a helper's by-design verdict on its low fire rate
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-10-11'
    target_surface: the shell logging library and its four callers
    detail_ref: >-
      Four shell hooks start with a call that should log each run. The function they call does
      not exist in the shared library, and never has (the library's history contains no
      definition). The call's error output is discarded and its failure ignored, so nothing
      ever reported it. Three of the four hooks have no record at all in a log that starts in
      June. The fire-rate audit lists hooks by the records it finds, so those three were never
      in it, and their absence read as nothing to report. The helper that audited hook health
      did not see this, because it reasoned from the records that exist. It is an instance of a
      rule promoted earlier in this same retro: an arm that fails open must leave a record
      saying so. Filed for a build session.

  - id: p26-3
    title: The stop gate died mid-run 72 times in four days and not once since its timeout was raised, and the harness's own records were the witness
    category: reliability
    evidence_count: 72
    source_catchment: the hook log, recounted independently, plus the harness's own turn-end records
    recommendation: watch
    status: partial-executed
    execution_target_week: '2026-10-11'
    target_surface: the stop gate and its harness timeout
    detail_ref: >-
      Seventy-two deaths between 09-29 and 10-02, all one reason class, and none in the 272 runs
      since the timeout was raised from 10 to 60 seconds. The harness's turn-end records show
      81 of 164 sampled runs since the raise took 10 seconds or more, the longest 19.3, so the
      raise is what prevents the deaths. Runs fall into two groups, about 2 seconds and 10 to 19
      seconds, and the cause of the slow group is not established. The gate's own death records
      come from its exit handler, so they can only cover deaths it survives long enough to log;
      the harness records are the independent witness. The open item stays open until the slow
      group is explained.

  - id: p26-4
    title: Removing a capability worked where wording had not — stray directory changes fell from eleven to five, and the one after the guard was blocked
    category: class-recurrence
    evidence_count: 5
    source_catchment: the window's learning entries, grouped by judgement and counted from their headings
    recommendation: watch
    status: executed
    execution_target_week: '2026-10-03'
    target_surface: the tracked project settings and the directory-change guard
    detail_ref: >-
      Last cycle shipped a setting that resets the shell's directory after every call, and a
      guard went live mid-window. Instances fell from eleven to five, and the only one after the
      guard went live was refused before it ran. One more occurred during this retro and was
      also refused. The drop is not a controlled measurement: the two cycles differ in exposure
      and in what got logged, so the cause is inferred. It is the only one of last cycle's five
      classes that fell.

  - id: p26-5
    title: The two largest recurring gap classes grew again, and both already have written rules that held on paper
    category: class-recurrence
    evidence_count: 30
    source_catchment: the window's learning entries, grouped by judgement and counted from their headings
    recommendation: build
    status: carried-open
    execution_target_week: '2026-10-11'
    target_surface: review prompts and mechanisms at the point of the act
    detail_ref: >-
      Seventeen entries describe a check that shared the model of the thing it checked, up from
      six, and sixteen describe a claim written from memory or a summary instead of the source,
      up from five. Three entries sit in both, so the two classes cover 30 distinct entries. The
      larger counts partly reflect a wider grouping this cycle, so the growth is inferred, not
      measured. Both rules are written and cited by the entries themselves; they fail at the
      moment of building the check, which is when they are least likely to be recalled. The
      response stays mechanisms, not more wording.

  - id: p26-6
    title: A mirrored roster drifted for the third time, and a patch to a third-party prompt vanished in an update with nothing watching
    category: convergence-gap
    evidence_count: 2
    source_catchment: retro-candidate triage, each candidate checked against its artifact
    recommendation: fix
    status: partial-executed
    execution_target_week: '2026-10-11'
    target_surface: the roles-map mirror and the plugin patch register
    detail_ref: >-
      A short copy of the agent roster kept for discoverability had missed a member added two
      versions ago, its third drift. It was synced to the canonical table, and a drift check
      that was approved in May and never built is now a backlog row. Separately, a one-line
      patch to a third-party plugin's prompt was gone, lost at some update with no warning. It
      was reapplied, with the text extracted by script from its register rather than retyped.
      Nothing watches for the next loss; the register is still the only guard, and that is
      recorded where the register lives.

  - id: p26-7
    title: The retro-candidate list converged for the third cycle running, from 49 live candidates to 30
    category: triage-convergence
    evidence_count: 19
    source_catchment: retro-candidate triage, every candidate ruled with a measured rate
    recommendation: reconcile
    status: executed
    execution_target_week: '2026-10-03'
    target_surface: the retro-candidate file and its history file
    detail_ref: >-
      Every live candidate was ruled with a recurrence rate and the matcher that produced it.
      After the operator's rulings, 19 closed and moved verbatim to the history file: 11 were
      promoted or routed to a backlog row, 8 closed as spent. Two of the promotions landed
      inside private workspaces and are counted here only. The 30 that stay are all holds, two
      of them narrowed: one keeps a single unpromoted rule, and one stays parked by the
      operator pending a design session. The move was checked line for line: every line of
      every relocated candidate arrived in the history file.

  - id: p26-8
    title: Every learning entry in the window now names its catcher, and the bucket for defects nothing caught read zero for the first time
    category: measurement-gap
    evidence_count: 127
    source_catchment: the capture-format caught-by field, read by the mandated tally
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-11'
    target_surface: the detection-source distribution
    detail_ref: >-
      The new learning-entry write path's first full cycle: 127 of 127 entries in the window carry
      a valid caught-by value. In September the bucket for defects that no party caught ran about
      level with the gate bucket; this cycle it is zero. That could mean better catching, or
      authors avoiding the value. It is not explained yet, and an unexplained improvement earns
      the scrutiny a worsening gets for free. The coverage figure changed basis this cycle and
      cannot be charted against the prior four.

  - id: p26-9
    title: External reviews timed out on their first run nine times, up from six, despite the reading-map brief
    category: tooling-reliability
    evidence_count: 9
    source_catchment: session-log audit, cross-checked against saved review returns
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-10-11'
    target_surface: the external-review brief format
    detail_ref: >-
      Nine first-run reviews hit the 540-second limit with no verdict; every one was re-run to a
      verdict. One of the nine was never written to the session log and was found only in the
      saved returns. Last cycle's reading-map brief did not stop the timeouts, and the brief
      skeleton filed last cycle is not built. No reviewer was unavailable, and no security
      signal fired.

  - id: p26-10
    title: The consultant was dispatched three times, the capture record saw one, and one decision left no receipt
    category: measurement-gap
    evidence_count: 3
    source_catchment: consultant health audit, two instruments compared
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-10-11'
    target_surface: the dispatch capture record and the receipt convention
    detail_ref: >-
      Same shape as last cycle, carried. The capture record sees only one kind of spawn, so it
      under-counts, and one of the three dispatches, a track-ordering consult, has no receipt, so
      the audit can see the dispatch and not the decision. No dispatch was dropped and none
      ended without a pick. The efficacy metrics remain receipt-bound and are not published as
      zero.

  - id: p26-11
    title: The post-compaction gate's one allowed denial is spent once per session, not once per compaction
    category: design-gap
    evidence_count: 1
    source_catchment: a learning-agent proposal, checked against the gate's source before it was put to the operator
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-11'
    target_surface: the post-compaction checkpoint gate
    detail_ref: >-
      The gate allows one denial after a compaction and then stands down. Its counter filters by
      session only, so a second compaction in the same session gets no enforcement. The stated
      reason for the cap is that repeat denials after the same compaction add nothing, which
      does not cover a second compaction. This retro's own session had two compactions and one
      denial. The operator approved counting the cap per compaction. It is a backlog row, not
      yet built.

