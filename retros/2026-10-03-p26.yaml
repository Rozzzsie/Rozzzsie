  notes: >-
    The learning agent authored three proposals from the window's catchment. One was checked
    against source code before it reached the operator, and the check turned a suspected bug
    into a design question. The operator approved all three as recommended: two in full and
    one as a backlog row rather than a build this week. None was executed in session; all
    three are backlog rows, so they surface in the readiness view rather than as queued
    statuses.

hook_health:
  silent_hooks_observed: 4
  absent_hooks_observed: 0
  audit_instrument_defects_found: 2
  enforcement_flips_verified_this_cycle: 0
  notes: >-
    Measured over a rolling seven days. Four hooks flagged silent, each read against its own
    records. One flag comes from timeouts in a single session a week ago, with none since. One
    is a ruled suppression the auditor does not classify, the defect last cycle named, now a
    backlog row. One is the subagent-return guard, deliberately kept red, whose next diagnosis
    needs a different instrument: a helper measured zero matches between its records and any
    subagent transcript. One is partly explained by finding 2. The audit's absent flag read
    zero, but three hooks are invisible to it because they have never written a record, which
    is the second instrument defect. The stop gate errored on 72 of 611 runs, all before its
    timeout raise; see finding 3.

