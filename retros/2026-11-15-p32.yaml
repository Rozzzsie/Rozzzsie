  notes: >-
    Hand-classified, and THE ARMS DO NOT SUM TO THE TOTAL: eight against nine. The ninth was caught
    by a commit-time gate, and this block's three arms are control, review and contradiction, none
    of which a gate is. Reassigning it to review would close the sum and misdescribe the detection,
    so the gap is published rather than closed — finding p32-11. All nine were my own measurement or
    authoring predicates, found while running and writing this retro. By control: two sweeps of the
    commit-boundary hooks whose zero was shown to be blind by a positive control with its expected
    non-zero stated first, and a pair of ledger rows whose rendered lead was shown to hide the
    finding the row exists to carry. By contradiction: two hand-rolled matchers over one backlog file
    disagreeing with each other, a fold set reported as five that held two, and an earlier claim that
    a trace file had lost blocks, refuted by direct measurement showing it had grown. By review: a
    deputy's absence claim relayed without checking, refuted by a three-day-old row, and a
    section-trigger premise refuted by reading the section in full. By gate: an invented field name,
    refused at commit. None was caught by an alarm, and seven of the nine returned a plausible
    result rather than an error.

