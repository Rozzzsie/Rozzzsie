discipline_metrics:
  ritual_steps_defined: 17
  ritual_steps_completed: 16  # of 17 labels; the propagation step did not complete, see notes
  notes: >-
    SIXTEEN OF SEVENTEEN, AND THE MISSING ONE IS THE PROPAGATION STEP. The basis is labels, not
    acts: the seventeen are the numbered steps in the ritual's own execution list, and a sub-part
    skip inside a completed label does not subtract, which is why the public-narrative companion
    being skip-passed costs nothing here, the step permitting it explicitly. The step that did not
    complete is the one that says to propagate unpropagated learnings now. Its object is whatever
    the preceding step identified, and that step identified eighty-two root-tier entries in the
    window carrying no promotion receipt at all. None of the eighty-two was propagated. This cycle
    did create and route its own captures, but those are the capture protocol's work and not this
    step's object, so counting them here would be scoring a different step twice. The deferral the
    operator issued covered three specific proposals from the learning agent and did not reach the
    eighty-two, so the shortfall is not excused by it. Disclosed rather than rounded: a sixteen with
    a named gap is worth more than a seventeen that had to be argued for. One further disclosure on
    the arithmetic: the learnings step completed only during the publication step, late and after the
    narrative artifact was already written, because the table originally published for it came from a
    substituted instrument and the mandated census had to be run before this figure could be honest.
    That history is a finding in its own right and does not change the count.
  monthly_subritual_due: false
  monthly_subritual_completed: null
