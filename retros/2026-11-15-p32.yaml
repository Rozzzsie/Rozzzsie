    span before the bracket, so a tag-scoped reader would read them as undated. Run again here, the
    tag-scoped reader finds ZERO undated rows. Either those rows have since been repaired or my tag
    predicate is not the prior cycle's, and nothing in either record distinguishes the two, so the
    cause is published as UNATTRIBUTED rather than narrated — see finding p32-12. The figure itself
    is unaffected, since no row is undated under either reader. Two consistency signals do hold: the
    age buckets sum to the open total with no residue, and the maximum age is the prior cycle's plus
    exactly seven days. This block has no producer script; every value is derived by hand, and the
    predicate above is the only thing that lets the next cycle check it.

