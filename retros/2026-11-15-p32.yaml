fam_dispatch_distribution:
  learning_agent: 2
  adversarial_reviewer: 0
  consultant: 3
  external_validator: null
  notes: >-
    THE VALIDATOR ARM IS PUBLISHED AS UNMEASURED, AND THE REASON IS THAT THE PRIOR CYCLE'S FINDING
    ON THIS EXACT ARM IS STILL OPEN AND RECURRED HERE. The automated figure was four hundred and
    fifty-six. Four hundred and forty-three of those are matches on a typed command name in
    transcript text, and the rules file naming that command is re-injected on every tool call, which
    is precisely the defect the prior cycle diagnosed and hand-corrected from five hundred and
    fourteen to two. The remedy was never built, so the arm reported the same class of figure again.
    Counting instead by receipt line, as the prior cycle did, the window's recent region shows two
    review engagements, both of the same validator, with the other returning a model-not-found error
    all cycle — but that enumeration was read from the log's recent region rather than partitioned by
    date, so two is a FLOOR and not a count, and a floor published as a point figure would be the
    same error in a smaller font. Hence null. THE OTHER THREE ARMS ARE SOUND AND ARE NOT AFFECTED:
    they come from counting in-session agent tool-calls, a different mechanism from the text match
    that contaminated the validator arm, so the contamination is isolated rather than general. The
    adversarial reviewer is a measured zero on that sound arm, not an unmeasured blank.
