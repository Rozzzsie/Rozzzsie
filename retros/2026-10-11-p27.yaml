interactive_mode: true

meta_finding: >-
  This cycle's sharpest findings were records that answered confidently about their own state
  and were wrong. A proposal ledger kept eight items marked pending for four to five months; one
  of them had already been superseded in its own lifecycle log, and no backlog row tracked the
  rest, so nothing surfaced them. The hook audit read two healthy hooks as failing because its
  list of result words is kept by hand. A rule against unverified "this is new" claims existed
  only in a reference file whose own header calls that a defect, and five such claims were made
  in a week. A push-safety rule fired only after a block, while the pushes that published another
  session's work followed no block at all. In each case the rule or record existed and was
  correct about something; it was attached to a place or a trigger the act never passed through.
  Each was moved to where the act happens this cycle, or filed where a reader will see it.

findings:
  - id: p27-1
    title: A proposal ledger kept eight items marked pending for four to five months, and its status line disagreed with its own lifecycle log
    category: convergence-gap
    evidence_count: 8
    source_catchment: the learning agent's catchment scan, then an audit of every pending block checked against its artifacts
    recommendation: reconcile
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: the learning agent's proposal ledger and the operational state file's decision rows
    detail_ref: >-
      The retro opened by reporting zero pending proposals; the search pattern had missed them.
      The learning agent found eight blocks still marked pending, 131 to 154 days old. One had
      been superseded in September and its log said so, while its status line still read
      pending, and a decision row built from that status line kept presenting it as an open
      question. No backlog row tracked the other seven, so no startup surface showed them. All
      eight were dispositioned this cycle: four rejected, two filed as backlog rows, one
      confirmed superseded by a later fix, and one corrected to the decision already made.
      A stale pending status manufactures work rather than hiding it.

  - id: p27-2
    title: The hook audit read two healthy hooks as failing, because its list of result words is kept by hand for each hook
    category: instrument-validity
    evidence_count: 3
    source_catchment: the hook-health audit, each flag traced to the hook's own source and the hook log
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-18'
    target_surface: the hook fire-rate auditor
    detail_ref: >-
      A new identity hook writes two result words the auditor does not know, so every record
      counted as other and the hook read as never passing. A close hook reused a word the auditor
      treats as an error for a benign no-op close, so it read as erroring. The auditor's own
      comment had predicted the second case. Last cycle produced a third member of the same
      class. The remedy is to derive each hook's result words from its source rather than share
      a hand-kept list; it is a backlog row. A third flag, the sub-agent return guard, stays red
      under a standing ruling with its diagnosis on its own row.

  - id: p27-3
    title: A push-safety rule fired only after a block, while three pushes that published or nearly published another session's work followed no block
    category: class-recurrence
    evidence_count: 3
    source_catchment: retro-candidate triage and a learning-agent proposal, both drawing on the window's learning entries
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: the always-loaded governance file
    detail_ref: >-
      The rule said to check whose commits are unpushed when a push is blocked. In one case the
      check and the push ran in the same call, so the push had already happened when the check's
      output arrived. The rule now fires on every push while another session may be live, the
      check lists every unpushed commit rather than the newest, and it runs alone, with the push
      in the next call. The governance file sat at the warning line of its size bound, so the
      addition shipped with a fold of background text to the companion reference in the same
      commit, as the bound's own rule requires. This retro applied the new rule to its own pushes.

  - id: p27-4
    title: Absence and novelty claims about the project's own records were wrong five times, and the rule against them lived only in a reference file
    category: convergence-gap
    evidence_count: 5
    source_catchment: a learning-agent proposal drawing on the window's learning entries
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: the output checklist's core section on verifying claims
    detail_ref: >-
      Five entries across three sessions called something untested, undefined or not tracked
      when the answer was already in the project's own design, plan, input or run folders. One
      reached a startup-card headline before it was corrected. The governing rule had been moved
      to a reference file, whose header says a rule found only there is a defect, and its list of
      places to search and its trigger words were both too narrow. It now sits in the core
      section with the full search set, and the section's pinned one-line summary was widened in
      the same edit.

  - id: p27-5
    title: A commit check on entry timestamps assumed a time zone the machine no longer runs in, and rejected valid entries
    category: design-gap
    evidence_count: 3
    source_catchment: a learning-agent proposal, the validator's comparison confirmed at the code
    recommendation: fix
    status: partial-executed
    execution_target_week: '2026-10-18'
    target_surface: the timestamp validator, the session clock line and the entry template
    detail_ref: >-
      The validator compares entry stamps against the machine clock, which moved to a different
      time zone around the start of October. Stamps written in the operator's local time read as
      about twelve hours in the future and were blocked. The failure blocks good entries rather
      than admitting bad ones. This cycle the validator's header now describes what it does, the
      session clock line shows the operator's local time from a setting, and the template states
      the heading form in use. The stronger fix, stamps that carry their own zone, is code on the
      commit path and is a backlog row.

  - id: p27-6
    title: Tests and probes that ran against live files changed real state three times in the window
    category: class-recurrence
    evidence_count: 3
    source_catchment: the window's learning entries, grouped by judgement, and a learning-agent deferral
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: the output checklist's section on keeping tests out of real state
    detail_ref: >-
      A mutation harness, a probe and a test each ran against a live file rather than a copy.
      A helper proposed a new gap class for this; it is a recurrence of an existing checklist
      section, so one rider on that section covers all three, and its routing entry was widened
      to name probes and mutation harnesses.

  - id: p27-7
    title: A guard on shared session files refused compound commands eight times in seven sessions, for the second cycle running
    category: class-recurrence
    evidence_count: 8
    source_catchment: the insight-card audit, counted by card header
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-18'
    target_surface: the shared-state write guard and its open design row
    detail_ref: >-
      The guard denies any shell command that names a shared session file and does anything
      beyond a short allowed list. It worked as designed each time, and each refusal cost a retry.
      Last cycle the ruling was to record and not add a rule; that ruling stands, and this cycle's
      cases are evidence on the guard's open design row. Thirteen distinct sessions across two
      cycles.

  - id: p27-8
    title: Promoting entries and folding them into history cannot share a commit, and the ritual's step text does not say so
    category: design-gap
    evidence_count: 1
    source_catchment: the history-band check blocking this retro's own fold
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-18'
    target_surface: the retrospective protocol's fold step
    detail_ref: >-
      The fold moves promoted learning entries into a history file, and the check accepts only a
      byte-identical move of the committed copy. Entries promoted earlier in the same retro differ
      from that copy by their new receipt line, so the combined commit was refused. The files
      were restored and checked byte-identical, and the work shipped as two commits. Eight more
      entries became due for folding on the same day, which raised the fold from seven entries to
      twenty-five. A backlog row asks the step to say "commit promotions first".

  - id: p27-9
    title: The cross-workspace routing rule put the reasons for not sharing a lesson in a report no later reader sees
    category: design-gap
    evidence_count: 7
    source_catchment: an adversarial audit of the routing protocol's version bump
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: the cross-pollination protocol, its entry template and its reference
    detail_ref: >-
      Most new lessons record that they were shared nowhere. The revision asked authors to say
      which candidates they judged out and why, but "in your report" named no surface, and the
      retrospective reads only the recorded value. The adversarial review found three serious and
      four minor issues, none critical. On the operator's rulings, the reasons now go on a routing
      line in the entry itself, and a constraint such as a leave window is named on that line
      rather than used as a reason to hold the lesson back. One serious issue is recorded as a
      named gap: the duty keys on a recorded value, and the list of candidates it is judged
      against is never stored, so the trigger cannot be checked later.

  - id: p27-10
    title: Both consultant dispatches left their decision in the wrong record, up from one of three last cycle
    category: measurement-gap
    evidence_count: 2
    source_catchment: consultant health audit, two instruments compared
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-18'
    target_surface: the consultant receipt convention
    detail_ref: >-
      Two consults, both on one day. The dispatch capture record saw neither, and the session log
      carries no consultant receipt for either; the picks were written into intent lines, one
      without the pick stated. The decisions reached the record, but in a place the audit does not
      read, so the efficacy metrics remain unpublished rather than zero. A backlog row covers it.

  - id: p27-11
    title: Every learning entry named its catcher for the second cycle, and the bucket for defects nothing caught read zero again
    category: measurement-gap
    evidence_count: 83
    source_catchment: the capture-format caught-by field, read by the mandated tally
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-18'
    target_surface: the detection-source distribution
    detail_ref: >-
      83 of 83 entries since the field became owed carry a valid value. The nothing bucket is zero
      for the second cycle running. Whether that is better catching or authors avoiding the value
      is still not established. Self-caught entries fell from 61 to 35 as the corpus shrank from
      127 to 83, and external catches doubled from 10 to 20.

  - id: p27-12
    title: A parked item's release condition named this retro, and the retro's own brief did not carry it
    category: convergence-gap
    evidence_count: 1
    source_catchment: reading the parked row before closing the retro
    recommendation: reconcile
    status: executed
    execution_target_week: '2026-10-11'
    target_surface: a parked backlog item and its census script
    detail_ref: >-
      A parked item about self-declared capture paths was to close if two consecutive retros ran
      its census clean. Last cycle made the census a committed script so every cycle would run it
      the same way. This retro's triage brief did not include it, and the omission was caught
      only because the state-file close read the row. The script ran unchanged: 236 entries, 24
      candidates, all true, none wrong. The item closed on its own condition. The parked warning
      it guarded would have fired on nine true captures. Same shape as the meta-finding: the
      condition was correct and sat on a surface the ritual's step list did not pass through.

proposal_backlog:
  authored_this_cycle: 3
  deferred_this_cycle: 0
  notes: >-
    The learning agent authored three proposals, each checked against its cited files before it
    reached the operator. All three were accepted as recommended and executed in session; one
    also produced a backlog row for its stronger alternative. Separately, the eight older pending
    blocks were dispositioned (finding 1), two of them as backlog rows. The agent deferred five
    further patterns itself: three already covered by a rider queued in the same retro, one
    working as designed, and two below its evidence threshold.

