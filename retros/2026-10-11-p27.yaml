  absent_hooks_observed: 0
  audit_instrument_defects_found: 1
  enforcement_flips_verified_this_cycle: 0
  notes: >-
    Measured over a rolling seven days. Two hooks flagged silent and one flagged for errors. Two
    of the three flags are false, from one auditor defect class (finding 2). The third is the
    sub-agent return guard, kept red under a standing ruling. One per-retro hook had no record in
    the window and sits inside its grace period. The stop gate ran 872 times, two of them errors.
    Of the two enforcement flips due for review, one gate's records were all automatic approvals
    of tools it has no category for, as designed; one of those tools can act in a browser and is
    noted for the operator. The other gate did not flip: today's miss rate is measured per graded
    turn, a different unit from its precondition.

