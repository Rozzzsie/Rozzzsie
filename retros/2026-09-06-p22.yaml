instrument_liveness:
  silent_failures_observed: 10
  caught_by_control: 1
  caught_by_review: 4
  caught_by_contradiction: 4
  notes: >-
    The review arm went from zero to four because it was actually used — two adversarial
    passes were commissioned this cycle against none in the prior one, and four of the
    ten were found by the first pass alone, including two that would have shipped a
    protocol unit whose trigger and remedy pointed at different halves of a file. The
    contradiction arm again matched it without tooling. The single control catch is the
    strongest kind: a mandated instrument disagreed with a hand derivation and was right.
    The tenth was caught by reading the artifact a citation pointed at.

detection_provenance:
  caught_by_control: 1
  caught_by_operator: 2
  caught_by_accident: 0
  instrumented_from: p18
  status: measured
  relation_to_detection_source_distribution: >-
    SAME QUESTION, DIFFERENT POPULATION — read the two together or neither. This block
    grades the FINDINGS in this retro: did a control catch it, or did the operator. The
    distribution block grades LEARNINGS ENTRIES across the cycle, in six buckets rather
    than three. The vocabularies are not yet mapped, the denominators are different by
    construction, and the two will not sum. Neither supersedes the other; this one is the
    five-cycle series and stays the trend card.
  notes: >-
    Both operator catches are worth naming because neither was reachable from inside the
    work. One challenged a claim that a monthly sub-ritual was due and was right about
    the outcome while the instrument was right about the trigger — the two had been
    collapsed into one sentence. The other challenged a headline asserting a ritual step
    did not exist, which forced the claim down to what was actually established: the
    surface was read every cycle and triaged by nothing.

detection_source_distribution:
  source: the capture-format caught-by field, read from the learnings corpus
  learnings_files_scanned: 13
  entries_in_window: 202
  entries_annotated: 4
  annotation_coverage: 0.02
  status: measured-first-cycle
  gate: 0
  deputy: 1
  self: 2
  rosie: 0
  contradiction: 1
  nothing: 0
  by_name:
    deputy:breakline: 1
  notes: >-
    SCOPE IS DELIBERATE AND NARROW, on the same axis as the dispatch block: counted from the
    governance root and its publishable workspaces only, because other roots hold private work
    and this figure is published. The denominator is therefore smaller than the corpus the
    emitter can reach, and the two are not comparable.
    THIS IS THE SECOND EFFICACY SERIES ON THIS DASHBOARD, NOT THE FIRST. detection_provenance has
    graded the same question over P10 findings since p18. This block was authored and registered
    without an overlap test against it, in the same cycle whose own protocol bump added the rule
    requiring one; caught by adversarial review, not by any instrument. Do NOT re-key the
    provenance trend card on this block's coverage — the mapping between the three buckets and
    these six is unwritten, and until it exists the two are separate measurements that happen to
    rhyme.
    READ THE COVERAGE FIGURE BEFORE ANY BUCKET. At 4 of 202 this is a SAMPLE OF FOUR, not a
    picture of the cycle, and every bucket reading zero means NOT YET WRITTEN rather than "this
    never happened". All four annotations are this retro's own P6 captures, written hours after
    the field shipped — so the first data point this metric has ever produced is a measurement of
    the session that built it, which is the least representative sample it will ever draw. The
    nothing bucket is a real value meaning the enforcement corpus did not catch the defect at
    all; it is the number this metric exists to make countable, and the one a compliance metric
    can never round up into a success. First representative distribution is p23, and the field
    is unenforced until then.
