improvement_backlog:
  total: 154
  open: 70
  done: 72
  parked: 12
  open_ready: 48
  open_decision_gated: 20
  open_upstream_blocked: 2
  notes: >-
    Measured 2026-09-06 from the backlog file, rendered through its own consumer's ready()
    predicate rather than a hand count. Intake and closure both rose: 33 items entered and 21 closed, so the open queue grew by
    twelve against a closure rate near two thirds of intake. SIX OF THIS CYCLE'S INTAKE WERE
    FILED BY THIS RETRO ITSELF, from findings an adversarial pass raised against the retro's
    own build — a retro that files its own defects inflates its own intake, and saying so is
    part of reading the number. The headline total is cumulative and includes 72 finished
    items, so it overstates the live workload by roughly half; that distinction matters
    because the total is the figure that gets read as the queue. Ready items outnumber gated
    ones better than two to one.
    ⛔ ONE ITEM MOVED from upstream-blocked to decision-gated between the first census this
    cycle and this one, and the cause is UNATTRIBUTED. The earlier figures were hand-derived;
    these are rendered through the consumer's own predicate, so the likeliest explanation is
    that the two instruments disagreed rather than that the item changed. It is recorded
    rather than explained, because naming a cause this census cannot see would be narration.

