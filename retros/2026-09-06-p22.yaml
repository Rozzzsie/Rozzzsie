window_end: '2026-09-06'
trigger_source: session-start-overdue-flag
interactive_mode: true

meta_finding: >-
  Two metrics in this dashboard were found to be counting a MECHANISM rather than an
  EFFECT, one cycle after the prior retro named that exact class in its own provenance
  block. The sharper of the two is the external-validator count: it can only ever read
  zero, because the two dispatch paths it recognises are both disabled for the agent by
  configuration, while the sanctioned path — a shell call to the review companion — is
  counted by neither. The session log records five real invocations of that companion
  inside this window, every one of them returning an account-level quota wall. A published
  zero that is structurally incapable of being non-zero is not a measurement of disuse.
  Neither instance was caught by an instrument; both were caught by holding two facts
  together.

findings:
  - id: p22-1
    title: The external-validator metric counts a dispatch path the agent cannot invoke
    category: instrument-validity
    evidence_count: 5
    source_catchment: session-log + tally source read
    recommendation: rework
    status: carried-open
    execution_target_week: '2026-09-13'
    target_surface: the metrics tally emitter
    detail_ref: >-
      Counted via an agent-dispatch type and a literal slash-command string. Both review
      slash-commands carry disable-model-invocation, so the agent can launch neither; the
      prescribed fallback is a shell call the emitter does not observe. Five in-window
      invocations are logged against a published zero.

  - id: p22-2
    title: The hook fire-rate audit grades a per-fire rate and flags it as a silence signal
    category: instrument-validity
    evidence_count: 2
    source_catchment: audit output + firelog re-derivation
    recommendation: rework
    status: carried-open
    execution_target_week: '2026-09-13'
    target_surface: the hook fire-rate audit
    detail_ref: >-
      The checkpoint-bar hook published 77.1% over 7,653 fires and flagged red, with
      remediation text naming four causes that are all wrong. The rate divides by fires;
      the ruled unit is the graded turn. Every one of the 1,750 no-op fires is a correct
      classification of a non-substantive turn. On the ruled unit the hook sits at 88.5%.
      Both flagged hooks this cycle are false positives.

  - id: p22-3
    title: A by-design no-op hook is on the expected roster but not the suppression list
    category: half-discharge
    evidence_count: 1
    source_catchment: audit output + hook source read
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-09-13'
    target_surface: the fire-rate audit suppression list
    detail_ref: >-
      The hook emits its no-op deliberately when there is nothing to do, exactly like the
      eleven hooks already suppressed. It flags red every cycle as a consequence.

  - id: p22-4
    title: The ritual required an artifact section that no step in the ritual produced
    category: text-mechanism-divergence
    evidence_count: 1
    source_catchment: learning-agent proposal, verified at the canonical
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-06'
    target_surface: the retrospective protocol unit
    detail_ref: >-
      The terminal step required the retro artifact to contain a triage of the candidate
      surface and cited a step number that resolves to an unrelated audit. No step
      triaged that surface. A numbered triage step was added and the citation corrected
      in the same edit — the same repair shape the prior cycle used for a different
      emitter with no decision arm.

  - id: p22-5
    title: The monthly housecleaning named three retired instruments and manufactured work
    category: text-mechanism-divergence
    evidence_count: 3
    source_catchment: read-contract manifest reconciliation
    recommendation: rework
    status: executed
    execution_target_week: '2026-09-06'
    target_surface: the retrospective protocol unit
    detail_ref: >-
      Its size instrument was retired two months ago, one subject's whole-file contract
      was retired six weeks ago, and the other subject never had a size bound. Followed
      literally the pass implied a large relocation sweep; the live bounds said no sweep
      was owed. All three arms rewritten against the read-contract manifest, which is now
      named as the cap authority.

  - id: p22-6
    title: A matcher convention can have several valid forms without ever having changed
    category: class-recurrence
    evidence_count: 3
    source_catchment: learning-agent proposal
    recommendation: widen
    status: executed
    execution_target_week: '2026-09-06'
    target_surface: the output checklist
    detail_ref: >-
      The section's first recurrence-class scoped its gap to hand-authored prose and to
      change-over-time. None of the three new instances is prose and none involved a
      convention that moved: the bound is SAMPLE, not TIME. Widened, and given an act
      routing row — its only prior row was the frame this recurrence refutes.

  - id: p22-7
    title: The corpus recorded who caught each defect in prose and nothing aggregated it
    category: measurement-gap
    evidence_count: 34
    source_catchment: learning-agent proposal, zero-control with a positive control beside it
    recommendation: build
    status: executed
    execution_target_week: '2026-09-06'
    target_surface: learning-capture unit + retrospective unit + metrics tally
    detail_ref: >-
      Almost every audit step in the ritual measures compliance. A closed
      value set now lands in the capture format, a bucket distribution is reported at
      presentation time, and the emitter publishes it. Unclassified values are fatal in
      the emitter rather than dropped, because a dropped annotation renders as a cleaner
      corpus. The field ships empty this cycle by construction.

  - id: p22-8
    title: The session that promotes a rule is the one session with no exposure to it
    category: enforcement-gap
    evidence_count: 17
    source_catchment: learning-agent cross-stream scan
    recommendation: build
    status: approved
    execution_target_week: '2026-09-13'
    target_surface: a governance-surface post-edit arm
    detail_ref: >-
      Measured latencies run twenty minutes to four hours and several are same-commit.
      The mechanism is arithmetic rather than discipline: the always-on rule set is
      re-injected for every FUTURE session, while the session that wrote a rule meets it
      only as its own authored text. Confirmed live during this very cycle — the edit
      that rewrote three carriers of a dead claim missed the fourth, three paragraphs
      below the sentence instructing it to re-read every carrier.

  - id: p22-9
    title: The candidate surface had no triage step and no close-out path
    category: convergence-gap
    evidence_count: 2
    source_catchment: adversarial review of this cycle's own bump
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-06'
    target_surface: the retrospective protocol unit + the candidate surface
    detail_ref: >-
      The first draft of the new triage step mandated an unbounded weekly read of a
      surface the read gate refuses outright — unexecutable, not merely expensive — with
      no destination for closed candidates, so every closed one would be re-triaged
      forever. Rewritten to enumerate headers, triage only unruled candidates, write the
      ruling into the header so the skip predicate is derivable, and relocate closed ones
      to a history file created in the same edit.

  - id: p22-10
    title: The backlog age instrument covers under a fifth of the open queue
    category: measurement-gap
    evidence_count: 1
    source_catchment: backlog census
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-09-20'
    target_surface: the architecture backlog schema
    detail_ref: >-
      52 of 64 open items carry no opened date, and the 12 that do skew recent by
      construction, so no honest age distribution exists. Ageing is the metric that
      distinguishes a long queue from a rotting one, and it is the one not measured.

  - id: p22-11
    title: A second efficacy series was published without an overlap test against the first
    category: measurement-validity
    evidence_count: 4
    source_catchment: adversarial review of this cycle's own build
    recommendation: reconcile
    status: partial-executed
    execution_target_week: '2026-09-13'
    target_surface: the metrics tally + both protocol units + this sidecar
    detail_ref: >-
      A block grading who-caught-it has been required and rendered on this dashboard since
      p18. A second one was designed, registered in the schema, shipped in the emitter and
      published here — and four separate surfaces asserted it was the OS's ONLY efficacy
      measurement. It is the second. The protocol unit bumped in this same cycle carries
      the rule that a new metric must run an overlap test against its semantic predecessor
      before re-keying anything; the rule was authored and violated inside one commit. The
      false "only" claim is struck on all four surfaces and both blocks now state the
      relation; the bucket mapping is still unwritten and is next cycle's work.

