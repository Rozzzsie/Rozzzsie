fam_dispatch_distribution:
  learning_agent: 2
  adversarial_reviewer: 20
  consultant: 6
  external_validator: 0
  notes: >-
    THIS IS THE SECOND EFFICACY SERIES ON THIS DASHBOARD, NOT THE FIRST. `detection_provenance` has graded the same question over P10 findings since p18. This block was authored and registered without an overlap test against it — in the same cycle whose own protocol bump added the rule requiring one. Caught by adversarial review, not by any instrument. Do NOT re-key the provenance trend card on this block's coverage; the mapping between the three buckets and these six is unwritten, and until it exists the two are separate measurements that happen to rhyme.
    SCOPE IS DELIBERATE AND NARROW ON TWO AXES, unchanged from the prior cycle: counted
    from the governance session root only, because other roots hold private work and this
    figure is published; and the counted unit is an in-session dispatch call, a MECHANISM
    rather than the EFFECT of delegated work happening. Total in scope 62, against 32 the
    prior cycle. The external-validator zero is NOT a measurement of disuse — see the
    meta-finding and finding 1. Two further adversarial dispatches were made after this
    figure was taken and are not in it.

