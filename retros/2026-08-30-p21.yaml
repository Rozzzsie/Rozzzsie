meta_finding: >-
  THE RECORD EXISTS; THE CONSUMER DOES NOT. Four independent findings this cycle
  reduce to one shape. A status token is written correctly and nothing reads it on
  a schedule. A watch condition banks a numeric trigger with no reader. A proposal
  queue accretes to eleven items, oldest ninety-eight days, because nothing consumes
  "pending". And a health audit is cited twice in the live index as "(existing)" while
  the protocol that would run it contains no such step — it was specified against the
  retrospective's PREVIOUS protocol number, and at the renumber someone updated the
  citation and never carried the audit across. The generalisation is that a maintained
  pointer is not evidence of a live referent, and a parenthetical that vouches for its
  own target inverts the reader's burden: a bare citation invites "is there one?",
  while "(existing)" answers the question before it is asked.

findings:
  - id: 21.1
    title: >-
      A HEALTH AUDIT ASSERTED AS "(existing)" WAS NEVER BUILT, AND ITS EMPTY OUTPUT
      REACHED THE LEARNING LAYER AS A FINDING. The consultant rail ran five times
      in-window, confirmed at member level by two independent corpora; its hand-written
      receipt surface carried zero. The zero was consumed as a measured value and came
      one threshold short of generating a proposal to remedy underuse that is not occurring.
    category: instrument-vacuity
    evidence_count: 5
    source_catchment: protocol-surface-audit
    recommendation: accept
    status: approved-queued
    execution_target_week: 2026-08-30
    target_surface: >-
      the retrospective protocol unit and the protocols index; rebuild the denominator
      from the machine-written dispatch capture corpus and retire the hand-written receipt
    alternative_framings: >-
      (a) rebuild against the machine corpus and drop the manual line; (b) keep the manual
      line and add a producer-side gate; (c) declare the audit retired. (a) recommended:
      it removes a hand-maintained link rather than adding an obligation to remember.

  - id: 21.2
    title: >-
      A COUNT TAKEN WITH AN AD-HOC INSTRUMENT FAILED THREE TIMES IN ONE CYCLE, ALL THREE
      RETURNING A PLAUSIBLE NON-ZERO OR ZERO AND NONE RAISING. A date matcher requiring a
      trailing bracket dropped an entire workspace; a card counter keyed on a marker the
      capture hook deletes returned zero against the richest week on record; and a queue
      census read off a truncated listing under-reported by 40 percent. Every one was caught
      by contradiction, none by a gate.
    category: measurement-integrity
    evidence_count: 3
    source_catchment: self-audit-during-ritual
    recommendation: accept
    status: approved-queued
    execution_target_week: 2026-08-30
    target_surface: >-
      the retrospective protocol's audit steps, which name the obligation and not the
      instrument, plus a checklist rider that truncating an output you are JUDGING is an
      instrument failure distinct from truncating one you are READING
    enforcement_log_ref: 'proposal authored one cycle earlier predicted this exact recurrence'

  - id: 21.3
    title: >-
      A METRIC KEYED ON A MECHANISM CANNOT SEE THE EFFECT IT NAMES. The dispatch
      distribution counts in-session agent tool-calls; delegated work that runs as its own
      headless session produces no such call and is invisible by construction. Measured:
      forty-five such runs in-window against a published figure that can only ever count
      the other kind.
    category: instrument-scope
    evidence_count: 45
    source_catchment: operator-challenge-to-a-published-figure
    recommendation: accept
    status: approved-queued
    execution_target_week: 2026-09-06
    target_surface: >-
      the metrics tally script; state the counted unit in the emitted field rather than
      leaving it inferable only from the source glob
    blocked_by: 'requires a decision on whether headless runs belong in this metric at all'

  - id: 21.4
    title: >-
      A SCRIPT'S HEADER COMMENT CLAIMED A WIDER READ SCOPE THAN ITS CODE HAS, AND THE
      DIVERGENCE IS THE ONLY THING PREVENTING A CONFIDENTIALITY LEAK. The narrow scope is
      correct and undocumented; the documentation describes the broad scope. A future
      session reconciling the two in the obvious direction would pull out-of-scope activity
      onto a published artifact, and that change reads as tidying an inconsistency.
    category: confidentiality-boundary
    evidence_count: 1
    source_catchment: operator-challenge-to-a-published-figure
    recommendation: accept
    status: approved-queued
    execution_target_week: 2026-08-30
    target_surface: >-
      the metrics tally script header; state the scope as a deliberate boundary with its
      reason, so the correct behaviour stops depending on an accident of the glob
    enforcement_log_ref: 'highest priority of the cycle: the only finding with an outbound direction'

  - id: 21.5
    title: >-
      A REPORTER'S POPULATION CLAIM INFLATED A BLOCKED BANK BY MIXING BUDGET-BLOCKED ITEMS
      WITH CORRECT NON-PROMOTIONS. Six were claimed as at-threshold-and-blocked; three are,
      and the other three are deliberate non-promotions for reasons that are not budget —
      two already covered by an existing rule, one awaiting evidence. Discharging those
      would file doctrine onto surfaces that already comply.
    category: inherited-claim
    evidence_count: 6
    source_catchment: learning-agent-return
    recommendation: accept
    status: executed
    execution_target_week: 2026-08-30
    target_surface: >-
      verified during the propagation step and corrected before any promotion shipped;
      the accompanying claim that the bank was dischargeable at zero cost was also false —
      measured headroom is 754 units against a rider typical of one

  - id: 21.6
    title: >-
      A PROPOSAL QUEUE ACCRETED TO ELEVEN PENDING ITEMS WITH NO SCHEDULED CONSUMER, OLDEST
      NINETY-EIGHT DAYS. Six predate the third month of the queue's existence. Nothing reads
      the pending state on a cadence, so the queue's depth and age are invisible unless
      someone greps for them deliberately.
    category: ledger-decay
    evidence_count: 11
    source_catchment: learning-agent-return
    recommendation: watch
    status: carried-open
    execution_target_week: 2026-09-06
    target_surface: >-
      the learning-agent proposal ledger; a disposition pass is owed before the queue is
      treated as a backlog rather than an archive

