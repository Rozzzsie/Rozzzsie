    evidence_count: 2
    source_catchment: "hook-fire-rate-audit + LEARNINGS-delta"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "next-cycle"
    target_surface: "SessionStart grader-degraded staleness-banner + audit-script classification-set extension + root LEARNINGS env-dependency-family doctrine"

  # Item B — nested §21: the silent-hook audit was itself blind to this silent hook
  - id: "1.2"
    title: "§21 helper-axis-completeness instance (NESTED) — the very audit script that detects silent hooks could not detect THIS one: its fire-action classification set never learned the grader's action vocabulary (real-verdict actions vs degradation-state actions), so it could not distinguish 'grader healthy' from 'grader dead.' Shipped two minor-versions ago; the classification set was never extended in lockstep when the grader's actions were added. Folded into the same antidote build (1.1)."
    category: "rule-clarification"
    evidence_count: 1
    source_catchment: "hook-fire-rate-audit"
    recommendation: "accept"
    status: "deferred"
    execution_target_week: "next-cycle"
    target_surface: "hook-fire-rate audit-script fire-action classification set extension"

  # Item C — NEW operational rule: a mid-session env fix does not reach long-lived hooks
  - id: "1.3"
    title: "NEW operational rule — a mid-session environment fix (PATH / installed binary / env var) does NOT reach long-lived hook subprocesses; they inherit the parent-process env frozen at session start, while tool-shell calls resolve fresh. Verified to artifact: after the runtime-dependency install, a tool-shell saw the binary but the grading hook still did not fire in-session. Rule: never claim a hook-dependent capability is restored on the strength of a tool-shell check alone — a session restart is required."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "session-meta"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-07"
    target_surface: "root LEARNINGS operational rule (mid-session env fix / hook env freeze)"

  # Item D — doctrine promotion: over-broad-negative-sweep surrogate
  - id: "2.1"
    title: "PROMOTED to doctrine — 'over-broad-negative-sweep surrogate': a 'net-new / not tracked anywhere / zero refs' claim is only as broad as the set you actually searched. Catalyst: a parked design arc was filed 'net-new, zero refs anywhere' after a sweep over a SUBSET of persistence tiers, when it sat complete in an un-grepped durable tier. Fix shipped: a canonical durable-backlog sweep-set (the named files a 'not-tracked-anywhere' claim must check) added as a verify-to-artifact sub-family."
