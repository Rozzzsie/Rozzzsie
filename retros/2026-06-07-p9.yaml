  - id: "2.2"
    title: "PROMOTED to doctrine — 'ground a design's own consistency claims one layer below where stated': verify a spec's 'reuses existing primitives / invents nothing new' claim at the MODALITY level, not the named-component level (catalyst: a proposed enforcement gate claimed primitive-reuse, but its enforcement MODALITY was net-new); and an escape hatch must never sit behind the gate it opens (catalyst: a time-limited bypass token was itself written by the action the gate blocks → deadlock). Added as a design-spec-review discipline + applicability-table row."
