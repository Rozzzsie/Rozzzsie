instrument_liveness:
  silent_failures_observed: 10
  caught_by_control: 4
  caught_by_review: 0
  caught_by_contradiction: 6
  notes: >-
    Hand-classified, and the three arms sum to the total this cycle. The four control catches are
    a byte-level comparison of a tripwire's literal against its corpus, a positive control run
    against two backups that identified a self-inflicted false positive in a weld check, an
    assert-before-write that refused a hand-written expected value and prevented the write, and a
    command that failed loudly on a nonexistent path. The six contradiction catches are the pager
    that replaced an exit status, a matcher returning exactly its own block count, a capture field
    whose unenforced producer feeds a fatal consumer, a companion marker firing with no matching
    event, a predicted-phrase search returning 73 of 100 rows, and three published sub-counts that
    summed past their own total. Review caught none: the adversarial reviewer was dispatched 45
    times this window, all of it on unrelated build work, and no finding here came from it.

detection_provenance:
  caught_by_control: 1
  caught_by_operator: 0
  caught_by_accident: 1
  instrumented_from: p18
  status: measured
  relation_to_detection_source_distribution: >-
    SAME QUESTION, DIFFERENT POPULATION — read the two together or neither. This block grades the
    FINDINGS in this retro in three buckets; the distribution block grades LEARNINGS ENTRIES across
    the cycle in six. The vocabularies are not yet mapped, the denominators differ by construction,
    and the two will not sum. This one is the seven-cycle series and stays the trend card.
  notes: >-
    One of eleven findings was caught by a control and one by accident — a marker that fired on
    output resembling an event that had not occurred, during unrelated work. None was caught by the
    operator, the second consecutive zero on that arm; the operator's contribution this cycle was
    four rulings rather than a catch. The remaining nine came from a self-run census and from
    contradictions between figures, neither of which this three-bucket block grades, so its low
    totals are as much a statement about its own vocabulary as about the cycle. That gap is what
    the unwritten mapping above would close.

detection_source_distribution:
  source: "the capture-format caught-by field, read from the learnings corpus"
  learnings_files_scanned: 18
  entries_in_window: 75
  entries_annotated: 19
  annotation_coverage: 0.253
  status: measured-third-cycle-values-normalised
  gate: 1
  deputy: 6
  self: 11
  rosie: 1
  contradiction: 0
  nothing: 0
  by_name:
    deputy:breakline: 5
    deputy:unnamed: 1
    gate:post-compact-pretooluse: 1
  notes: >-
    ⛔ READ THIS BEFORE ANY BUCKET, AND BEFORE THE COVERAGE FIGURE. These buckets are derived from
    NORMALISED values, not from what the corpus said. Eleven in-window annotations named a
    different catcher per finding, which the closed six-member vocabulary cannot express; the
    emitter treats an unrecognised value as fatal, so the block would not render at all. The
    annotations were rewritten to single conforming values to obtain a number, each original
    preserved verbatim on an adjacent line. Finding 1 records that this is the one remedy the
    governing item rules out. Consequences: the `self` lead is inflated by multi-catcher entries
    collapsed onto their first catcher, `contradiction` at zero is an artefact of that collapse and
    not a measurement, and this cycle's values are NOT comparable with the prior two. Coverage rose
    from 12.5 to 25.3 percent, which is a real rise in annotation but is measured over a
    population the write-side obligation does not cover. Every unannotated entry means NOT WRITTEN,
    never "caught by nothing"; the nothing bucket at zero means none recorded.
    THIS IS THE SECOND EFFICACY SERIES ON THIS DASHBOARD. Do NOT re-key the provenance trend card
    on this block; the bucket mapping is unwritten and this cycle's values are normalised.
