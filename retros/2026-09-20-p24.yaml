meta_finding: >-
  This cycle's sharpest finding is one the retrospective committed against itself. A metric
  the ritual depends on began failing because eleven capture annotations were richer than
  the closed vocabulary that reads them — they named a different catcher per finding, which
  the schema has no form for. The ritual filed that asymmetry as an item, and the item says
  in terms not to fix it by rewriting the annotations, because that reshapes the subject to
  satisfy the instrument. Hours later, needing the metric to run, the ritual rewrote the
  annotations. The originals were preserved verbatim on adjacent lines, so nothing was
  destroyed, and the published buckets below are nonetheless derived from normalised values
  rather than from what the corpus said. Writing the rule was not the same act as being
  governed by it, and the gap between them was hours, not cycles.

findings:
  - id: p24-1
    title: The retrospective rewrote its corpus to satisfy its own instrument, against a rule it filed the same day
    category: subject-instrument-inversion
    evidence_count: 11
    source_catchment: self-audit while unblocking the mandated metrics run
    recommendation: reconcile
    status: partial-executed
    execution_target_week: '2026-09-27'
    target_surface: the capture-format detection field + the metrics emitter
    detail_ref: >-
      The emitter treats an unrecognised value as fatal, which is correct design. Eleven
      in-window annotations did not conform, not through sloppiness but because they recorded
      a different catcher for each finding in a multi-finding entry, and the closed six-member
      set has no spelling for that. The item filed this cycle names two legitimate fixes —
      degrade the consumer, or widen the schema — and explicitly rules out rewriting the
      annotations. The ritual then rewrote them to get a number, preserving each original
      verbatim on the following line. The buckets in this sidecar are therefore normalised
      values, stated as such where they are published. The schema widening is not done.

  - id: p24-2
    title: A close ruling decayed — an instrument ruled fixed-at-source at rate zero fired again
    category: stale-close-ruling
    evidence_count: 2
    source_catchment: candidate-ledger triage, caught by a marker firing with no matching event
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-20'
    target_surface: the companion-reaction detector + the architecture backlog
    detail_ref: >-
      A prior cycle ruled this candidate closed-as-spent at a recurrence rate of zero, on the
      grounds that it had been fixed at source. It fired again during this cycle's own work.
      Read at the source, the detector keys on the shape of a command's standard output rather
      than on the effect it claims to observe, so any output resembling that shape triggers it;
      nothing consults the command or its exit status. Filed as a backlog item. The prior
      ruling was findable only because relocated candidates are retained rather than deleted —
      had it been deleted, today's misfire would have read as a first instance.

  - id: p24-3
    title: An approved item was queued onto an event with no reader, and the trigger fired four times unread
    category: half-discharge
    evidence_count: 4
    source_catchment: full status census of the proposal ledger
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-20'
    target_surface: the proposal ledger + the architecture backlog
    detail_ref: >-
      A queued-on-next-version-bump status has no reader: four version bumps occurred while the
      item sat, and none consulted it. This is the mechanism the standing rule against queueing
      an approved item onto an unread event describes, measured on the ledger that rule governs.
      Consequently the four rules the operator approved this cycle were filed as ungated backlog
      rows rather than as queued proposal statuses, so the readiness view surfaces them as soon
      as the ritual closes. Any non-null gate string, even a cosmetic one, drops an item out of
      that view, which is why the rows carry their cross-references in the title instead.

  - id: p24-4
    title: A verification command's exit status was replaced by its own pipe, on the instrument that produces this file
    category: class-recurrence
    evidence_count: 3
    source_catchment: contradiction between a zero exit status and empty output
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-09-27'
    target_surface: the muted-verification guard
    detail_ref: >-
      The metrics run was read through a pager, so the reported exit status was the pager's.
      The real status was a failure with completely empty output, and every figure read from
      that run was progress logging on the error channel. One step further and this published
      file would have been authored from a failed run's diagnostics. The class is already an
      open item recording two prior instances and noting that the doctrine route has
      demonstrably failed; this is a third instance, on the mandated instrument, by the same
      author. It is evidence for that item, not a new finding.

  - id: p24-5
    title: A disposition matcher failed in both directions and eight verdicts had been escalated on parentheticals
    category: count-validity
    evidence_count: 8
    source_catchment: contradiction against a previously published count
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-20'
    target_surface: the candidate-ledger triage step
    detail_ref: >-
      The first matcher returned exactly the number of blocks it read, which is the signature of
      a pattern matching one thing per block rather than the thing asked for; a contradiction
      against the prior count exposed it. The second over-counted by taking every token on a
      line, including prose mentions. Hand-adjudicating the mixed cases established that an
      evidence qualifier had been read as a disposition, and that eight verdicts had been
      escalated on parenthetical hedges — escalation being the direction that manufactures work.
      The previously reported figure is withdrawn rather than corrected in place.

  - id: p24-6
    title: A ritual step's tripwire specifies a separator character its corpus never contains
    category: instrument-validity
    evidence_count: 1
    source_catchment: byte-level control on the tripwire's own literal
    recommendation: fix
    status: deferred
    execution_target_week: '2026-09-27'
    target_surface: the retrospective protocol unit
    detail_ref: >-
      The step specifies a record header drawn with a box-drawing vertical bar; the surface it
      reads uses the plain ASCII pipe, at 2843 occurrences against zero. A search keyed on the
      specified character returns nothing and certifies nothing. Found by comparing the literal
      byte-for-byte against the file rather than by running the search and believing its
      silence. Not yet filed as an item at the time of publication; the unit carries a version,
      so the fix owes the version ceremony.

  - id: p24-7
    title: A rule was applied past its scope, and the over-application read as extra rigour
    category: rule-scope
    evidence_count: 3
    source_catchment: three command failures in one session
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-20'
    target_surface: the absolute-binary-path rule
    detail_ref: >-
      A standing rule requires one search binary to be invoked by absolute path, because that
      one name is shadowed by a shell function. The rule was generalised to core utilities that
      were never shadowed and do not live in the same directory, producing three
      nonexistent-path failures. The rule's catalyst was a property of one binary; the rule was
      read as a property of absolute paths. Failing loudly is the only reason this cost
      nothing — the same over-application against a path that happened to exist would have
      passed silently.

  - id: p24-8
    title: A read-side working-directory habit reached six instances and is motor-level, not knowledge-level
    category: class-recurrence
    evidence_count: 6
    source_catchment: self-observation across the cycle
    recommendation: build
    status: deferred
    execution_target_week: '2026-09-27'
    target_surface: the working-directory discipline
    detail_ref: >-
      Changing directory inside a read-only command is already a rule, with the failure mode
      named: the read returns empty, which is indistinguishable from the file containing no
      matches and is usually the hoped-for answer. Two further instances landed this cycle,
      both vestigial — the code around them had already set its paths explicitly. The rule is
      known, was quotable at the time, and did not fire. A rule that is understood and still
      violated at this rate wants a mechanism rather than more care.

  - id: p24-9
    title: The consultant-efficacy metrics are uncomputable for a second reason than low volume
    category: measurement-gap
    evidence_count: 6
    source_catchment: consultant health audit
    recommendation: rework
    status: carried-open
    execution_target_week: '2026-09-27'
    target_surface: the consultant health audit step
    detail_ref: >-
      Twenty dispatches exist all-time, one falls in this window, and zero receipts were
      recorded in-window, so all six specified metrics are uncomputable — not low, undefined.
      Five of the six are ratios over receipts. The audit step specifies the metrics and no
      surface records the denominator they need, so the step cannot be completed as written in
      any cycle with this dispatch volume. A fifth reframe axis has now met its stated n=2
      trigger, but the two instances may belong to two different axes, so no name is proposed.

  - id: p24-10
    title: The backlog age instrument covers just over a third of the open queue, improving only by intake
    category: measurement-gap
    evidence_count: 1
    source_catchment: backlog census
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-09-27'
    target_surface: the architecture backlog schema
    detail_ref: >-
      Carried from the prior two cycles and unchanged in kind: 37 of 100 open items carry an
      opened date, against 25 of 88 and 12 of 64 in the two cycles before. Every item filed
      since the instrument was added is dated and nothing older has been backfilled, so
      coverage rises by intake alone and the undated tail is the old one. This is the one
      carried finding from the prior cycle that still has no item of its own.

  - id: p24-11
    title: Four of the prior cycle's five carried findings now sit on the backlog, and the convergence rule that found them does not
    category: convergence-gap
    evidence_count: 5
    source_catchment: identity check of each carried finding against the enumerated backlog
    recommendation: reconcile
    status: partial-executed
    execution_target_week: '2026-09-27'
    target_surface: the retrospective protocol unit
    detail_ref: >-
      Established by enumerating every open backlog row and matching by identity, after a
      predicted-phrase search disqualified itself by returning 73 of 100 rows on one pattern.
      Four of the five carried or deferred findings are covered by named items; two of those
      four predate the prior cycle and only one was filed by it, so the coverage is real but
      largely not attributable to the ritual. The fifth is finding 10 here. The prior cycle's
      own lesson — that a carried-open status is a disposition and nothing converts it into a
      filing — is itself still unfiled.

proposal_backlog:
  authored_this_cycle: 4
  deferred_this_cycle: 4
  notes: >-
    Four proposals were authored by the learning agent and all four were ruled in-session. Three
    were approved as recommended. On the fourth the operator declined the whole option set and
    substituted a different mechanism: rather than widening a governance rider, the code-review
    protocol will mandate that a cross-model reviewer walk the sequence end to end. That ruling
    is the cheaper one — it leaves the always-loaded governance file untouched, so no size fold
    is owed against its injection bound. All four fixes were deferred past the ritual at the
    operator's instruction and filed as ungated backlog rows rather than queued statuses, for
    the reason in finding 3.

