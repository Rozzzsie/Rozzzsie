  silent_hooks_observed: 2
  absent_hooks_observed: 1
  audit_instrument_defects_found: 2
  enforcement_flips_verified_this_cycle: 0
  notes: >-
    Silent candidates fell from five to two: a subagent-return guard, whose unattributed producer
    is an open item and deliberately kept red, and a drift-scan hook keyed on a tool name, so any
    write through a different tool never reaches it — the prior cycle's finding, unchanged. One
    hook shows zero records in the window, the audit's self-declared highest-value failure mode,
    and per an item filed this cycle that flag cannot distinguish a dead hook from one whose
    trigger class never occurred; this is a send-gate in a week with nothing to send, so the
    second reading is at least as likely and no dead-hook claim is made. One hook carries a 24
    percent error rate whose fire-rate flag is suppressed as by-design while the error rate is
    not. Both audit instrument defects were found this cycle: six action values that fall in no
    set the auditor defines, and the absent-flag ambiguity above.

