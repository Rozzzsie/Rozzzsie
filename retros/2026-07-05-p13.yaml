# Narrative companion: SKIP-PASS this cycle, same reason as p9–p12 — the center
# of gravity IS governance (the retro itself shipped a patch protocol bump + 7
# rule promotions), so the findings below ARE the cycle's substance. The
# product/build execution arc is genericized-out as workspace work. Private
