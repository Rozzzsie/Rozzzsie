retro_id: '2026-10-18-p28'
retro_date: '2026-10-18'
prior_retro: '2026-10-11-p27'
schema_version: '1.1'
window_start: '2026-10-11'
window_end: '2026-10-18'
trigger_source: session-start-overdue-flag-interactive
interactive_mode: true

meta_finding: >-
  This cycle's sharpest findings were numbers and pointers that were faithful to their input and
  wrong about what the input was. The metrics tally counted 132 external-validator launches, and
  every one was the always-loaded rules file quoting the command it says cannot be launched. A
  lesson deferred five weeks ago said it was filed on a backlog row, and that row had closed
  without it, so it sat on no ledger. Four quality traces counted hook fires or responses as
  turns. A guard on sub-agent returns logged thousands of agents that left no transcript, and
  what spawns them is still unattributed. In each case the count or pointer resolved and its
  arithmetic was right; it had been keyed on a string, an id or a record kind rather than on the
  thing it was meant to stand for. The corrected figure is published here, and each fix is on a
  ledger.

findings:
  - id: p28-1
    title: The metrics tally counted the always-loaded rules file as 132 external-validator launches
    category: instrument-validity
    evidence_count: 132
    source_catchment: a contradiction between the tally's output and the rule that this launch route cannot be used by the agent, then a census of the contributing records by kind
    recommendation: fix
    status: partial-executed
    execution_target_week: '2026-10-25'
    target_surface: the sidecar metrics tally's typed-command arm
    detail_ref: >-
      The tally matches any user-role text containing the command string and skips only
      compaction summaries and meta records. The record that injects the rules file at session
      start is neither, and the rules quote the command, so every session added about three
      launches. All 132 contributing records were that one kind. Real launches on that route this
      window were zero, which fits that validator being at its usage cap. This sidecar publishes
      the corrected figure, 17, by hand, with the raw figure in the block's note. It is the third
      time this script has counted a mention as an invocation, and each earlier fix excluded only
      the record kind that had been seen. The fix is a backlog row: key the count on a structure
      only a real invocation leaves. Last cycle's published 38 may be inflated the same way; it
      cannot be re-measured now, so it is unverified.

  - id: p28-2
    title: A commit flag that fences paths, not authors, swept other live sessions' lines into commits three times, and the lesson had been on no ledger for five weeks
    category: class-recurrence
    evidence_count: 4
    source_catchment: a learning-agent proposal, checked against the window's learning entries and the backlog
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-18'
    target_surface: the always-loaded governance file and the output checklist's commit section
    detail_ref: >-
      A commit restricted to named paths takes every change at those paths, including another
      session's uncommitted lines in a file several sessions write by design. Three sessions hit
      it this week. The same lesson was learned in September and recorded as owed; the backlog row
      it pointed to closed without it. The rule now says to read the file's diff first and stage
      only your own lines, or commit it whole and name whose lines rode along. The governance file
      was close to its size warning line, so the addition shipped with a fold of three background
      passages to the companion reference, in one commit.

  - id: p28-3
    title: Four hand-built mutation-test loops hit known traps, two of them missing from the checklist
    category: convergence-gap
    evidence_count: 4
    source_catchment: a learning-agent proposal, both missing traps confirmed absent from the checklist section
    recommendation: fix
    status: partial-executed
    execution_target_week: '2026-10-18'
    target_surface: the output checklist's mutation-testing section and a backlog row for a shared runner
    detail_ref: >-
      Two traps were new: a raised-exception mismatch read as a crash rather than a kill, and an
      interrupted run whose summary looked complete. A third trap was already in the checklist and
      its author did not fetch it. On the operator's ruling, the two missing traps became checklist
      riders this cycle, and a shared runner with every trap built into its first lines is a
      backlog row, since it is critical logic that needs two cross-model reviews.

  - id: p28-4
    title: The commit-time timestamp check will admit future-dated entries after the clock change, and skips 162 entries that carry zone text inside the bracket
    category: design-gap
    evidence_count: 162
    source_catchment: two deferred learning-agent items, re-measured across every change log
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-18'
    target_surface: the learning-entry template and the always-loaded state-update rule
    detail_ref: >-
      When the machine clock falls back on 1 November, a stamp labelled with the summer zone will
      pass up to an hour in the future. Separately, entries that put zone text before the closing
      bracket are never graded: 162 of 1,640 timed lines across 20 change logs, up from 88 to 156
      on the eight files first measured five days earlier. No rule prescribed that shape; it was
      habit. On the operator's ruling both were fixed in doctrine rather than in the gate: the
      template says to copy the zone from the session clock line, and the state-update rule says
      zone text goes after the bracket. No gate changed, so no review was owed.

  - id: p28-5
    title: A guard on sub-agent returns logged thousands of agents that left no transcript, and what spawns them is unattributed
    category: measurement-gap
    evidence_count: 422
    source_catchment: reading a parked item whose release date had passed, then measuring the guard's log against the transcript store
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-25'
    target_surface: the sub-agent return guard and its open backlog row
    detail_ref: >-
      The parked reminder's release date was 26 days past and its condition was met, so it was
      unparked. The guard logged 3,904 records. Every agent this retro dispatched by name matched
      its transcript, but 3,552 of 3,792 ids have no transcript anywhere, and 422 records are
      no-transcript errors. Nothing run could see what spawns those agents, and no agent-type
      hooks are configured. The operator ruled to attribute the source first and decide on
      suppression afterwards; the measurement is on the guard's row.

  - id: p28-6
    title: About ten unpropagated lessons became rules in their own workspaces in one approved batch, then their bodies were folded to history
    category: convergence-gap
    evidence_count: 11
    source_catchment: the learning-file read across every routed file
    recommendation: reconcile
    status: executed
    execution_target_week: '2026-10-18'
    target_surface: five workspace rule files, two checklist riders, and seven history files
    detail_ref: >-
      The promotion batch edited more existing entries than the commit check allows without the
      operator's approval line, so it was put to her and approved. Eleven receipts were written.
      Fifteen promoted entries then moved byte-identical to their workspaces' history bands in a
      separate commit, as last cycle's finding required, and four history files were created.
      Two items were held: one is covered by a standing memory and goes to the learning agent with
      the time-claims family, and one needs the operator's judgement.

  - id: p28-7
    title: Four traces over-claimed their checkpoint denominator, and the template's label still names the unit the operator ruled against
    category: class-recurrence
    evidence_count: 4
    source_catchment: cross-reference of every in-window trace against the hook log
    recommendation: fix
    status: approved
    execution_target_week: '2026-10-25'
    target_surface: the quality-trace template
    detail_ref: >-
      Three traces counted responses or fires above the graded-turn count, and one recorded 13
      hook fires as turns against about two graded turns. None under-reported a miss. The label
      the stop gate parses says responses, while the ruled unit is the graded turn. One of three
      sampled traces failed on this, below the escalation threshold. A backlog row adds a guidance
      line beside the label without changing the gate's key.

  - id: p28-8
    title: The four rules recorded as not holding are the same four as last cycle
    category: class-recurrence
    evidence_count: 28
    source_catchment: the instance-of tally over every learning file, with spelling variants merged
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-25'
    target_surface: the always-loaded governance file's affected rules
    detail_ref: >-
      Post-compaction checkpoint placement 6, inherited owed items 9, absence claims 6, and counts
      as measurements 7. The first already has a gate, so its instances were caught there rather
      than slipping past. The other three are reasoning rules with no mechanical form. All four
      are held. The tally splits one rule across two spellings, which is a defect in the tally.

  - id: p28-9
    title: Seven of 37 gradeable entries skipped the routing judgement, all in one private workspace, and seeded lessons are rarely acted on
    category: measurement-gap
    evidence_count: 7
    source_catchment: the routing census over the window
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-25'
    target_surface: the cross-pollination protocol's routing line
    detail_ref: >-
      Cumulatively 31 seeded lessons have arrived in other workspaces; two were promoted there and
      none was cited. One routing judgement ruled a workspace out because it did no mutation
      testing, and that workspace ran mutation tests two days later.

  - id: p28-10
    title: The consultant's dispatch capture has recorded nothing since late September, so its health metrics stay unmeasured
    category: measurement-gap
    evidence_count: 0
    source_catchment: consultant health audit, capture files and session-log receipts compared
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-25'
    target_surface: the consultant receipt convention
    detail_ref: >-
      No consult ran in this window, so all six health metrics have a zero denominator, which is
      unmeasured rather than zero. The capture also missed last cycle's two consults. Last cycle's
      approved backlog row covers the receipt; it is not built.

  - id: p28-11
    title: The share of checkpoint turns the hook graded fell ten points while the per-turn pass rate held
    category: measurement-gap
    evidence_count: 1
    source_catchment: the hook fire-rate audit, compared with the two prior cycles
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-10-25'
    target_surface: the checkpoint-bar hook and its open grading-coverage row
    detail_ref: >-
      Graded share 49.4 percent against 59.5 last cycle and 56.5 the cycle before, while about 98
      percent of graded turns passed. The audit cannot flag a fall in coverage on its own. The
      denominator's definition was not re-checked this cycle.

proposal_backlog:
  authored_this_cycle: 2
  deferred_this_cycle: 8
  notes: >-
    The learning agent found ten patterns above its threshold, wrote two full proposals and
    deferred eight. Both proposals were checked against their cited sources before they reached
    the operator. The first was accepted as recommended; the second was accepted in modified form,
    doctrine now and the runner as a backlog row. Two deferred items needed the operator and were
    ruled at the retro presentation (findings 4 and 9's time-claims family).

hook_health:
  silent_hooks_observed: 2
  absent_hooks_observed: 0
  audit_instrument_defects_found: 1
  enforcement_flips_verified_this_cycle: 0
  notes: >-
    Measured over a rolling seven days. Two hooks flagged silent. One is the identity hook, healthy,
    whose two result words the auditor still does not recognise; that is last cycle's defect,
    carried on its backlog row. The other is the sub-agent return guard (finding 5). The per-retro
    promotion gate had been skipped last cycle and was run this cycle, so it is not absent. Of the
    two enforcement flips due for review, the send-retraction gate auto-approved 61 calls to 24 tools
    it has no category for, as designed; 16 of those calls were browser-acting tools, up from one
    last cycle, which is noted for the operator. The checkpoint ack gate did not flip, for last
    cycle's reason. The flip reviews ran after the retro presentation, not before it.

