# P10 Retro Sidecar — 2026-08-02 (P10 retro #17, sanitized public snapshot)
#
# Window 2026-07-26 → 2026-08-02 (7 days). The FIRST retro of a calendar month, so
# the monthly housecleaning sub-ritual fires alongside the ten ritual steps.
# Stakeholder names genericized to role-class; workspace names genericized per the
# public workspace table; private personal-track + career-track + capital-track
# references dropped entirely; evidence citations to private files, commit hashes,
# hook filenames, chat/docs thread IDs, internal item numbers, exact protocol
# version strings, and product internals stripped.
#
# Schema: retro-sidecar-schema-1.0 (canonical, private).
#
# Narrative companion: SKIP-PASS, same reason as p9–p16 — the centre of gravity IS
# governance, so the findings below ARE the cycle's substance.
#
# Mode this cycle: an INSTRUMENT-FAILURE retro, and the theme is uncomfortable.
# The operator asked for the ritual to be run end-to-end, explicitly against the
# prior cycle's failure (closed with six of ten steps unrun). It was. But the
# dominant finding is not about the week's engineering — it is that NINE of the
# instruments used to CONDUCT this retro each returned a confident wrong answer at
# least once. Eight pointed in the flattering
# direction: "already clean", "no work needed", "everything qualifies". None was
# caught by review. Every one was caught by a control — a positive control, a
# negative control, a calibration file, or running the renderer instead of reading
# the file. The cycle's honest lesson is that instrument discipline is not a
# supporting practice for audit work; on this evidence it IS the audit work.

