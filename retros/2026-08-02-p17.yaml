  total: 79
  done: 40
  open: 28
  parked: 11
  open_ready: 14
  open_decision_gated: 12
  open_upstream_blocked: 2
  notes: >
    Proposed improvements, distinct from the defect ledger above: a defect is a
    known way the system is wrong, a backlog item is a way it could be better.
    Kept separate because collapsing them is what produced the enforcement
    miscount recorded below. Scheduling axis is a DERIVED view — an item whose
    status field carries an unrecognised value is dropped from it silently, so
    the axis figures are a claim about what classified, never about what exists;
    they are reconciled against the raw total (14+12+2 = 28 open).

enforcement_coverage:
  measured_at: "2026-08-02 15:3x"
  measured_from: "code — enforcement flags and deny-paths enumerated from the tree"
  arms_built: 6
  arms_armed: 6
  arms_with_written_exit_criteria: 6
  arms_with_falsifiable_exit: 5
  arms_declared_permanent: 1
  checks_enumerated: 28
  checks_with_written_exit_criteria: 0
  checks_unit: "blocking exit paths in the commit-time arm"
  checks_unit_note: >
    A CHECK is one invariant inside an arm. THE UNIT IS INSTRUMENT-DEPENDENT and
    that is disclosed rather than hidden: the same file yields 28 by exit-site,
    22 by distinct block banner, 17 by numbered test case. ⛔ THE UNIT IS NOW
    PINNED AT 28 (exit-site), because that is the figure the enforcement-arms
    manifest and this file's own notes already publish — two units for one
    population across three surfaces is the defect, not the arithmetic. The
    reading does not turn on the choice: the numerator is 0 for every plausible
    denominator, so this component is 0.0 under all three. The denominator also
    covers ONLY the commit-time arm; the other five arms' sub-checks are not yet
    enumerated, so 28 is a floor and this component is, if anything, generous.
  notes: >
    ⛔ SUPERSEDES `hook_health.enforcement_gates_with_teeth_off: 3` ABOVE, which
    is retained unedited as the record it is. That 3 was carried from a prose
    status row that counted a gate which has NEVER BEEN BUILT. An unbuilt gate
    is not a gate with its teeth off; it is an absent gate, and it belongs in
    the improvement backlog. Two denominators had been collapsed into one, with
    the effect of reporting a WORSE number than the truth while hiding an
    unbuilt-gate backlog inside it. Re-derived from code rather than from prose:
    6 arms can deny, 6 are armed. Two of those six were armed on the day of this
    retro, taking the figure from 4/6 to 6/6. ✅ THE ZERO-EXIT-CRITERIA HALF WAS
    ALSO CLOSED THIS DAY, and the figure DERIVES from a manifest rather than
    being asserted here: 5 arms carry a falsifiable exit criterion, 1 declares
    itself permanent with a rationale, and both forms count because the defect
    being repaired was SILENCE, not the absence of an off-switch.
    Two rules shaped it. First, A GATE THAT IS ON SUPPRESSES THE EVIDENCE THAT
    WOULD JUSTIFY TURNING IT OFF — "no violations observed while armed" is the
    gate working, not proof the problem is solved — so every behavioural arm's
    criterion REQUIRES a deliberate shadow cycle as part of its test. Second,
    forcing an exit condition onto permanent infrastructure would be a fiction
    written to make this dial read 100.
    ⛔ AND THE MANIFEST IMMEDIATELY SURFACED A NEW GAP ONE LEVEL DOWN, recorded
    rather than hidden behind the permanent declaration: the commit-time arm
    holds 28 individually-retirable checks and NOT ONE states its own exit
    condition. Arm-level coverage is complete; check-level coverage is zero.
    That is next cycle's work, and it is the more honest reading of this dial.

instrument_liveness:
  silent_failures_observed: 9
  caught_by_control: 9
  caught_by_review: 0
  notes: >
    Scores the LOOP, not the absence of failure. Nine instruments used to conduct
    this retro each returned a confident wrong answer at least once; every one was
    caught by a control — a positive control, a negative control, a calibration
    file, or running the renderer instead of reading the file — and NOT ONE was
    caught by review. The dial therefore reads full while the absolute count is
    displayed beside it, because the health question is "when an instrument lied,
    did something catch it", not "did any instrument lie". A denominator of
    instruments-exercised is not recorded and has NOT been invented to make a
    rate; the count stands unnormalised.

detection_provenance:
  status: "AWAITING-DATA"
  instrumented_from: "2026-08-09-p18"
  caught_by_control: null
  caught_by_operator: null
  caught_by_accident: null
  notes: >
    The outcome metric — of the defects surfaced in a cycle, how many were caught
    by a control that COULD have failed, versus caught by the operator asking a
    question. It ships empty on purpose. Nothing currently records, per defect,
    who caught it, and the figure cannot be backfilled: reconstructing who would
    have caught a past defect is fabrication, not measurement. A single-session
    sample was available and was NOT used as the dial value — that session was
    spent building instruments, so its control-catch rate is unrepresentative and
    flattering, which is precisely the shape this OS treats as a warning rather
    than a result. Real from p18 forward.

