# ─── Schema 1.1 blocks ────────────────────────────────────────────────────────
#
# Added 2026-08-02. The four blocks below feed the health-score widget set.
#
# ⛔ THE COMPOSITE SCORE IS NOT STORED HERE, DELIBERATELY. It is derived at
# render time from these blocks. A derived label written into a stored field
# goes stale the instant any input moves, and nothing can tell you it did —
# the same defect class this OS has banked three times in two days. If you
# find a `health_score:` key in a sidecar, it is a bug.

defect_ledger:
  measured_at: "2026-08-02 15:3x"
  measured_from: "governance status file — escalator rows, classified by tag"
  open_total: 38
  live: 34
  parked: 4
  age_under_7d: 28
  age_7_to_29d: 8
  age_30d_plus: 0
  age_undated: 2
  median_age_days: 2
  max_age_days: 12
  notes: >
    DELIBERATELY UNSCORED. This is inventory, not health. A governance OS that
    scored itself on defect count would score highest with its instruments off,
    and every audit that worked would lower the number. What is diagnostic here
    is the AGE distribution, not the total: nothing on this board is older than
    12 days and the median row is 2 days old, which describes a board being
    worked rather than a graveyard. The total moved 37 → 38 during the session
    that measured it, because that session filed a row; the figure names the
    state it was measured at rather than claiming to be current.

