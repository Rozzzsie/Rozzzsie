instrument_liveness:
  silent_failures_observed: 9
  caught_by_control: 9
  caught_by_review: 0
  notes: >
    Scores the LOOP, not the absence of failure. Nine instruments used to conduct
    this retro each returned a confident wrong answer at least once: six matcher
    formats, a self-authored capture label, the public metrics tally, and the
    hook-health audit's own classification columns. Every one was caught by a
    control and NOT ONE was caught by review — identical to the prior cycle, which
    is itself the finding, since the review layer has now failed to catch this
    class in two consecutive cycles.

    ⛔ The specific control that worked is worth naming because it is cheaper than
    the ones that did not: a CONTRADICTION between an instrument's output and one
    fact known about the same object without that instrument. It requires no
    source-reading and it fired six times out of six. A conventional positive
    control was present in at least one case and PASSED while the result was
    wrong — a control validates the instrument, never the enumeration.

detection_provenance:
  status: "LIVE"
  instrumented_from: "2026-08-09-p18"
  caught_by_control: 7
  caught_by_operator: 0
  caught_by_accident: 2
