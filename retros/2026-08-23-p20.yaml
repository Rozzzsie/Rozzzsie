  checks_unit_note: >
    Unit pinned at 28 (exit-site) as established three cycles ago, so the manifest and this file
    publish one unit for one population. The numerator is 0 under every plausible denominator.
  notes: >
    ⭐ AN IMPROVEMENT ON LAST CYCLE'S BLANKET CARRY, AND A PARTIAL ONE, WHICH IS WHY IT IS LABELLED
    PER-ARM. The scheduled enforce-flip review walked both dated bindings and verified each AT
    RUNTIME rather than in source: the retraction gate's shadow flag is unset in the live
    environment and the gate is registered; the withholding gate's arming knob is false-for-dry-run
    and it is registered. Registration was checked separately from arming, because armed code that
    is not registered is an ABSENT guard, not a weak one.

    The withholding gate additionally has its FIRST in-session evidence rather than shadow data:
    it denied three times this cycle, then approved once a canonical acknowledgement was emitted —
    no wedge. A malformed acknowledgement using the wrong field separator correctly did NOT clear
    it. Both adversarial-audit MUSTs that blocked the original flip therefore held under real load.

    ⚠️ THE REMAINING FIVE ARMS ARE CARRIED AND WERE NOT RE-DERIVED. Stated because a carried number
    that looks current is a defect this architecture has banked repeatedly, and because "partially
    re-measured" read as "re-measured" is the exact shape of a partial-mechanisation claim.

instrument_liveness:
  silent_failures_observed: 11
  caught_by_control: 4
  caught_by_review: 1
  caught_by_contradiction: 6
  notes: >
    Scores the LOOP, not the absence of failure. Eleven instruments used to conduct this retro
    returned a wrong answer: a changelog matcher losing ~40% of its corpus; a grep against a path
    that does not exist, whose empty output read as a finding; a self-authored echo line asserting
    a zero directly above its own contradicting output; an audit tripwire that would have published
    a regression that does not exist; an exact-match citation resolver reporting 13 dangling
    pointers where the consumer resolves by prefix and none dangle; a pagination matcher keyed on
    one notation where five exist; a shell variable holding a newline-separated list, passed as a
    single filename; an interpreter chosen by hand rather than read from the registered command,
    missing a module the real one has; and a library call passed text where it expects a path.

    ⭐ RE-DERIVED AT CLOSE, NOT AT AUTHORING — AND THE COUNT MOVED FROM 9 TO 11 BECAUSE TWO MORE
    OCCURRED WHILE THIS FILE WAS BEING WRITTEN. One was caught by the schema's own unknown-field
    arm: the tally script's output key names were lifted verbatim into the sidecar, where the
    schema has a different vocabulary, and six fields warned. That is an ENFORCEMENT LAYER DOING
    ITS JOB on the author of the retro, and the correct response was to re-key the block rather
    than widen the schema around the mistake. A control render of the prior cycle's sidecar
    returned zero warnings, which is what established the drift as newly introduced rather than
    inherited. The other was a hand-written confidentiality check whose shell logic reported a
    leak on every row while printing a zero count beside it.

    ⛔ SIX OF ELEVEN WERE CAUGHT BY CONTRADICTION, which continues to outperform the controls — one
    fact known about the object WITHOUT the instrument, requiring no source-reading and no tooling.
    Four were caught by a control in the strong sense that a runtime or a validator raised. 

    ⭐ ONE WAS CAUGHT BY REVIEW, ENDING A THREE-CYCLE STREAK OF ZERO. The learning-layer agent
    audited the orchestrator's own pagination matcher and inverted its conclusion. Why it worked is
    the transferable half: the reviewer had NO access to the corpus the orchestrator used, ran its
    own instrument, and the two disagreed. That is not carefulness, it is INDEPENDENCE — and it is
    the only property that distinguished this catch from the three cycles of misses before it.

    ⚠️ TWO OF THE NINE WERE THE ORCHESTRATOR'S OWN MATCHERS BEING NARROWER THAN THE CONSUMER'S,
    not too narrow in the ordinary sense. Re-running them, checking their flags, or adding a
    positive control all CONFIRM them and change nothing, because they were correct about the
    question they asked and wrong about the question that mattered.

