meta_finding: >
  AN AUDIT STEP THAT NAMES THE OBLIGATION AND NOT THE INSTRUMENT IS RE-IMPLEMENTED BY HAND EVERY
  CYCLE, AND THE HAND-ROLLED INSTRUMENT IS WORSE THAN THE ONE ALREADY IN THE TREE. Two of this
  ritual's ten steps mandate a sweep and name no parser. Three parsers for the same format already
  exist in the codebase and all three are correct. The ritual used a fourth, invented at the point
  of use, which lost roughly 40% of the corpus — and the loss was not uniform: it silently dropped
  three workspaces to zero on a step whose own text says "all active workspaces."

  The sharper half is the direction. A hand-rolled matcher that under-counts returns a PLAUSIBLE
  NON-ZERO, and a non-zero is its own positive control — it proves the file was reached, the tool
  ran, and the pattern compiled. So it passes affirmatively and nothing invites a re-check. Every
  zero-keyed tripwire in this architecture is blind to it by construction. What caught it was not
  a control but a CONTRADICTION: one fact known about the corpus without the matcher.

  And the same step failed in the opposite direction on the same cycle. Its second audit tripwire
  names no corpus AND has no affirmative token, so "never observed = regression" is true by
  construction — unfalsifiable, and it would have published a regression that does not exist. The
  independent check showed 77% compliance. Both failures are one defect: the step specifies WHAT
  to conclude and not WHAT to read.

findings:
  - id: "p20-f1"
    title: "An audit step that mandates a sweep and names no parser is re-implemented by hand every cycle"
    category: "ritual-specification"
    evidence_count: 3
    source_catchment: "cross-workspace changelog corpus; three existing parsers in-tree; independent re-measurement by the learning-layer agent"
    recommendation: >
      Name the canonical parser in the step text, the same shape as the publication step which
      already names its enforcing surface explicitly rather than its schema file. Measured both
      ways this cycle: the ad-hoc matcher returned 68 of 182 from one corpus and 81 of 195 from
      another. The counts differ because the corpora differ; the finding does not, because in
      both the loss is non-uniform and drops three workspaces to zero.
    status: "approved"
    execution_target_week: "2026-08-30"
    target_surface: "retrospective protocol unit, step 1"

  - id: "p20-f2"
    title: "An audit tripwire with no corpus and no affirmative token is unfalsifiable"
    category: "ritual-specification"
    evidence_count: 2
    source_catchment: "session log; transcript store; learning-layer agent verbatim re-read"
    recommendation: >
      The step must name its corpus and state the token that counts as compliance. The natural
      surface returns near-silence, which reads as regression; the transcript store shows 30 of
      39 in-window sessions demonstrably compliant, so no regression exists. Meanwhile the
      natural surface's one in-window line is a SHORTFALL record, not a compliance citation —
      so the step is wrong in both directions at once. Its silence is not evidence of failure
      and its content is not evidence of success.
    status: "approved"
    execution_target_week: "2026-08-30"
    target_surface: "retrospective protocol unit, step 5"

  - id: "p20-f3"
    title: "A fold creates a two-copy invariant with no consumer that can see both halves"
    category: "documentation-architecture"
    evidence_count: 1
    source_catchment: "governance anchor and its reference companion, read as a pair"
    recommendation: >
      The reference companion carried a paragraph stating that nine surfaces were unaudited,
      nine days after the anchor recorded all twelve as audited. Nothing can detect this: each
      file reads complete on its own and only the PAIRING is wrong. A fold's edit must close by
      re-reading the reference section it targets, and must record in the reference when a
      paragraph has been superseded — otherwise a later reader cannot distinguish a repaired
      section from an original one.
    status: "executed"
    execution_target_week: "2026-08-23"
    target_surface: "governance reference companion"

  - id: "p20-f4"
    title: "A rule's own home violated the rule — three count and ordering defects inside the section that forbids them"
    category: "self-application"
    evidence_count: 3
    source_catchment: "governance anchor, measured against itself"
    recommendation: >
      The section carries an obligation reading "before writing a count for a CLASS, grep the
      class name on the surface that tracks it — never enumerate from the local paragraph."
      Measured in that very section: the header claimed five mechanisms against six named; the
      obligations header said "all four" while listing six; and the obligations were numbered
      1 2 3 4 6 5. All three are corrected, the missing mechanism is restored as a named clause,
      and the rotting count in the body is replaced with an unnumbered form. Being the author of
      a rule confers no protection: the reasoning that names a pattern runs somewhere other than
      the habit that would prevent it.
    status: "executed"
    execution_target_week: "2026-08-23"
    target_surface: "governance anchor"

  - id: "p20-f5"
    title: "A module docstring asserted shadow mode for 21 days after the gate was armed"
    category: "stale-assertion"
    evidence_count: 1
    source_catchment: "enforcement gate source, docstring compared against live calibration knob"
    recommendation: >
      The gate's calibration-knob comment block was current and correct; the docstring 55 lines
      above still said the deny path is built but never fires, and that enforcement was deferred
      to a date two months past. The arming was recorded at the knob and never reached the
      surface a reader reads FIRST. Direction is toward inaction: a reader concludes there are no
      teeth and may write code assuming the deny is inert. Corrected, with a standing instruction
      that any future change to the arming knobs updates the docstring in the same edit.
    status: "executed"
    execution_target_week: "2026-08-23"
    target_surface: "enforcement gate module docstring"

  - id: "p20-f6"
    title: "A corrective signal is unsatisfiable after a context compaction, and its counter is fire-denominated"
    category: "instrument-calibration"
    evidence_count: 1
    source_catchment: "this session's own hook firelog, reduced by turn signature"
    recommendation: >
      Measured live: 58 corrective records against ONE distinct turn signature — 58x inflation,
      above the documented aggregate and median. The graded turn was frozen on the far side of a
      compaction and could not be retroactively repaired, so the remedy line "self-correct in the
      current turn" was unsatisfiable: the correction HAD been made, and the withholding gate had
      already cleared on it. The two instruments disagreed about the same session at the same
      moment — gate cleared, corrective reporting a growing consecutive run. Belongs on the
      existing parked backlog row for this class, with the post-compaction arm as a new axis.
    status: "deferred"
    execution_target_week: "2026-09-06"
    target_surface: "improvement backlog, existing parked row"

