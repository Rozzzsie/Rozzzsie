# P10 Retro Sidecar — 2026-08-23 (P10 retro #20, sanitized public snapshot)
#
# Window 2026-08-16 → 2026-08-23 (7 days). Not the first retro of the month, so the monthly
# housecleaning sub-ritual does not fire; only the ten weekly steps are in scope.
# Stakeholder names genericized to role-class; workspace names genericized per the public
# workspace table; private personal-track + career-track + capital-track references dropped
# entirely; evidence citations to private files, commit hashes, hook filenames, thread IDs,
# internal item numbers, exact protocol version strings, and product internals stripped.
#
# Schema: `dashboard/render.py` § SIDECAR_SCHEMA — the enforced contract (rc=3 on a missing
# required field). `schema_version` records which revision this file was authored against.
#
# ⭐ THE REVIEW LAYER CAUGHT ONE THIS CYCLE, ENDING A THREE-CYCLE STREAK. p19 recorded that
# not one silent instrument failure had been caught by review in three consecutive cycles.
# This cycle one was — and it was caught by the learning-layer agent auditing the ORCHESTRATOR's
# matcher, not by a human reading a diff. The catch is real and its shape is worth stating: the
# reviewer had no access to the corpus the orchestrator used, ran its own instrument, and the
# two disagreed. Review worked here because it was INDEPENDENT, not because it was careful.

