  ritual_steps_defined: 10
  ritual_steps_completed: 10
  monthly_subritual_due: false
  monthly_subritual_completed: false
  quality_gate_traces_sampled: 2
  quality_gate_traces_passing: 2
  intent_confirmation_skip_rate: null  # not measured this cycle
  response_marker_missed_turns: 45
  response_marker_graded_turns: 280
  response_marker_blocking_fires: 935
  response_marker_miss_rate: 0.16
  response_marker_measured_at: "window-wide, auto-tallied — NOT this session alone; see note"
  response_marker_note: >
    ⛔ THE UNIT IS THE WINDOW, NOT THE SESSION, AND SAYING SO IS THE POINT. The prior cycle
    published a SINGLE SESSION's figures in these keys (9 graded turns, 120 fires). This cycle
    publishes the WINDOW, auto-tallied: 45 missed turns of 280 graded, from 935 blocking fires
    of 3,838 total. The two are not comparable and neither is comparable to cycles before the
    per-turn correction, which published the raw fire form.

    ⭐ THE FIRE-TO-TURN INFLATION WAS MEASURED DIRECTLY THIS CYCLE, IN THE ORCHESTRATOR'S OWN
    SESSION, AT 58 FIRES AGAINST ONE TURN SIGNATURE — far above the documented aggregate and median
    for this class, and the evidence behind finding f6.

    ⛔ AND THE PRECONDITION FOR THAT DIVISION WAS CHECKED RATHER THAN ASSUMED, BECAUSE A STANDING
    BOARD ROW SAYS IT MUST BE. The divide-by-signature rule recovers a TURN count only while the
    signature pointer ADVANCES; against a frozen pointer the identical arithmetic cannot separate
    one miss re-graded N times from N turns never graded, and both readings fit every field the
    instrument writes. The flattering reading is the one the sanctioned formula hands you, which is
    why the check is owed. Here the pointer demonstrably advanced: three signature blocks, strictly
    sequential with no interleaving — a non-substantive stretch graded no-op, then 36 consecutive
    PASS records on a fully compliant turn, then the current block run. The quotient is therefore a
    turn count, and it is stated as one on VERIFIED grounds rather than by citing the rule.

    ⭐ THAT ALSO SUPPLIES THE DISCRIMINATOR THE BOARD ROW WAS OPENED TO FIND: clean sequential
    transitions across several distinct signatures is positive evidence the pointer tracks turns;
    a SINGLE signature spanning an entire session is what indicts it. The test needs no source
    reading, which is what makes it usable at close.

    ⚠️ THAT SESSION'S 22 ARE NOT REPAIRABLE AND THE INSTRUMENT CANNOT SAY SO. The graded turn sits
    on the far side of a context compaction: it is frozen, cannot be retroactively marked, and the
    corrective's instruction to self-correct in the current turn is therefore unsatisfiable. The
    withholding gate, reading turns rather than fires, had already CLEARED on the emitted marker
    while the corrective went on reporting a growing consecutive run. Two instruments, one
    session, one moment, opposite answers — only one of them right about the present.
  notes: >
    Auto-tallied by the metrics script, not author-estimated. The per-TURN denominator is the only
    honest one; the raw fire counts inflate by roughly an order of magnitude.

