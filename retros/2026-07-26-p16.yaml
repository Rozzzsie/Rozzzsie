# P10 Retro Sidecar — 2026-07-26 (P10 retro #16, sanitized public snapshot)
#
# Window 2026-07-19 → 2026-07-26 (7 days; weekly cadence, opened interactively by
# the operator). A regular weekly — the monthly housecleaning sub-ritual is not due
# (it fires on the first retro of a calendar month; that was three cycles back).
# Stakeholder names genericized to role-class; workspace names genericized per the
# public workspace table; private personal-track + career-track + capital-track
# references dropped entirely; evidence citations to private files, commit hashes,
# hook filenames, chat/docs thread IDs, internal item numbers, exact protocol
# version strings, and product internals stripped.
#
# Schema: `dashboard/render.py` § SIDECAR_SCHEMA — the enforced contract (rc=3 on a missing required field). The `schema_version` below records which revision this file was authored against.
#
# Narrative companion: SKIP-PASS this cycle, same reason as p9–p15 — the center of
# gravity IS governance (one rule promotion, three enforcement builds, and a
# ritual-completion self-catch), so the findings below ARE the cycle's substance.
# Private narrative: the cycle's retro file in the private workspace.
#
# Mode this cycle: an ADVERSARIAL-CATCH + SELF-CATCH retro. The theme is a
# DIRECTIONAL asymmetry in self-review, and the retro found it twice — once in the
# week's engineering (below, meta_finding), and once in the retro ritual ITSELF:
# the cycle was declared closed with six of the ten ritual steps unrun, because the
# completion stamp fires when the retro ARTIFACT is written rather than when the
# RITUAL completes, so the next session's status banner read NOT DUE over an
# unfinished cycle. The operator caught it, not the OS. Both new findings in this
# sidecar (6.2 and 5.3) exist only because the ritual was resumed and finished.
#
# Honest headline on the trend line: checkpoint-discipline miss rate improved to
# 0.19 (from 0.26), the best reading in the measured series — but the improvement
# is an AVERAGE, and the mechanism built this cycle to close the worst cluster
# (post-compaction continuation turns) shipped with its teeth OFF on a verified
# adversarial finding. The miss then recurred live, twice, inside this very
# session, minutes after a compaction, while the gate that exists to catch it sat
# in shadow. The average moved; the peak cluster did not.
#
# This is the 14th P10 retro sidecar in the multi-retro rendering era (n=14 after this ship).

