retro_id: '2026-09-13-p23'
retro_date: '2026-09-13'
prior_retro: '2026-09-06-p22'
schema_version: '1.1'
window_start: '2026-09-06'
window_end: '2026-09-13'
trigger_source: session-start-overdue-flag
interactive_mode: true

meta_finding: >-
  The sharpest instrument failure this cycle was the retrospective's own bookkeeping, and
  it failed three times in one direction. A housecleaning pass reported the size of its
  edit set as the size of the stale set. An approved build recorded as "filed" sat on no
  ledger for a week. Four findings the prior cycle carried forward were on no work list at
  all. Each record was accurate about what had been done and silent about what had not,
  so every re-read confirmed it. None was caught by an instrument aimed at it; all three
  surfaced from a full census run for a different reason.

findings:
  - id: p23-1
    title: A housecleaning pass published its edit count as the count of stale items
    category: count-validity
    evidence_count: 2
    source_catchment: full status census of the proposal ledger
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-13'
    target_surface: the proposal ledger + the operational changelog
    detail_ref: >-
      Seven stale proposal statuses were reported corrected. A census of every pending
      status afterwards found more: one shipped item still read pending, and one approved
      item had never been filed. Seven was the number of edits made, not the number of
      items that needed one. The count is corrected where it was published, and the older
      pending statuses the census did not verify are named as unverified rather than
      counted as clean.

  - id: p23-2
    title: An approved build was recorded as filed and sat on no ledger for a week
    category: half-discharge
    evidence_count: 1
    source_catchment: full status census of the proposal ledger
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-13'
    target_surface: the architecture backlog
    detail_ref: >-
      The prior retro's table said the build was filed with its coverage caveat. The
      backlog, the open-items list, the changelog and the session history were each
      searched and none carried it. A table cell in a narrative artifact had been the only
      record. Filed on the backlog this cycle, caveat attached, with the proposal status
      corrected in the same pass.

  - id: p23-3
    title: Four findings carried forward by the prior cycle were on no work list
    category: convergence-gap
    evidence_count: 4
    source_catchment: backlog and open-items sweep against the prior sidecar
    recommendation: reconcile
    status: partial-executed
    execution_target_week: '2026-09-20'
    target_surface: the retrospective protocol unit + the architecture backlog
    detail_ref: >-
      Three were marked carried-open and one approved, all due this week. None of the
      three instruments they named had a commit since the prior retro. The approved one is
      now filed (finding 2); the other three remain open and are re-carried here. A
      carried-open status in a published sidecar is a disposition, and nothing in the
      ritual converts it into a filing.

  - id: p23-4
    title: A rule's recorded home never held it
    category: text-mechanism-divergence
    evidence_count: 3
    source_catchment: learning-agent proposal, verified against the file history
    recommendation: fix
    status: executed
    execution_target_week: '2026-09-13'
    target_surface: the output checklist
    detail_ref: >-
      An attribution-checking rule was recorded as promoted to a named checklist section.
      That section has only ever carried a different rule, and a history search confirmed
      it never held this one. The operator approved fixing the named section; the fix
      shipped as a new section carrying the rule, widened from quoted rulings to quoted
      speech, stated intent and who-did-what, with a correction of record naming every
      site that repeated the false claim.

  - id: p23-5
    title: Rule triggers borrow the wording of the case that prompted them
    category: class-recurrence
    evidence_count: 9
    source_catchment: learning-agent cross-stream scan
    recommendation: widen
    status: executed
    execution_target_week: '2026-09-13'
    target_surface: the learning-capture protocol unit
    detail_ref: >-
      A trigger phrased in the catalyst's own vocabulary reads as not applying wherever
      the logic applies but the words differ. Nine in-window instances, none caught by any
      gate. The learning-capture unit gained a test: before shipping a rule, check its
      trigger against one case that is not the one that prompted it.

  - id: p23-6
    title: The session-close ordering rule was satisfiable only by discipline
    category: enforcement-gap
    evidence_count: 7
    source_catchment: learning-agent proposal + adversarial review of the build
    recommendation: build
    status: executed
    execution_target_week: '2026-09-13'
    target_surface: the session-close protocol unit
    detail_ref: >-
      The rule that one state file must be written last had recurred seven times, because
      the commit hook demands further writes as a precondition of the commit. A small
      helper now performs the close writes in a fixed order in one process. Adversarial
      review found four serious defects before it shipped; each became a regression test
      that fails against the pre-fix code by assertion.

  - id: p23-7
    title: Three approved rules shipped with named bounds and widening was declined
    category: enforcement-gap
    evidence_count: 2
    source_catchment: adversarial review of this cycle's own ship
    recommendation: watch
    status: deferred
    execution_target_week: '2026-09-20'
    target_surface: the learning-capture unit + the output checklist
    detail_ref: >-
      Review named surfaces both new rules miss by reading their text: rules written into
      hook error messages, agent briefs and memory files, and attribution to agents or
      roles. No in-window instance of harm on those surfaces was measured. The operator
      ruled to keep the bounds; the next cycle counts real instances there, and an unquoted
      attribution that is correct does not count as one.

  - id: p23-8
    title: A planned deny-list keys on a field that is empty on every error it must deny
    category: instrument-validity
    evidence_count: 103
    source_catchment: hook firelog re-measure
    recommendation: rework
    status: carried-open
    execution_target_week: '2026-09-20'
    target_surface: the subagent-return guard
    detail_ref: >-
      The guard logged 103 errors in the window. Its first planned fix shipped; its second
      was a deny-list by agent type, and the type field is empty on every no-transcript
      error row while nearly every passing row is typed. The source of the untyped payloads
      is unattributed; naming one would be narration this measurement cannot support.

  - id: p23-9
    title: The response-marker miss recurred on a context-compaction resume
    category: class-recurrence
    evidence_count: 3
    source_catchment: checkpoint firelog, grouped by consecutive-miss runs
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-09-20'
    target_surface: the response-marker rule
    detail_ref: >-
      This retro's own session missed the marker on three graded turns, one of them the
      resume after compaction, which a standing rule already covers. The fires collapse to
      three turns, not to the raw fire count. An open item already records that misses
      cluster on compaction boundaries with the mechanism unattributed; this is added
      evidence, not a new mechanism.

  - id: p23-10
    title: Session boundaries in the operational log lost their headers again
    category: class-recurrence
    evidence_count: 3
    source_catchment: session-log audit
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-09-20'
    target_surface: the session-log writer
    detail_ref: >-
      Three session starts in the window open on a bare intent line with no heading, and
      two more use a one-level heading a two-level search does not see. The same defect was
      caught and fixed once in the prior window. A header search therefore undercounts
      sessions, which is the denominator several audits use.

  - id: p23-11
    title: The backlog age instrument still covers under a third of the open queue
    category: measurement-gap
    evidence_count: 1
    source_catchment: backlog census
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-09-27'
    target_surface: the architecture backlog schema
    detail_ref: >-
      Carried from the prior cycle and unchanged in kind: 25 of 88 open items carry an
      opened date, against 12 of 64 a week ago. Every item filed since then was dated, so
      coverage improves only by intake, and the undated tail is the old one.

proposal_backlog:
  authored_this_cycle: 3
  deferred_this_cycle: 3
  notes: >-
    All three authored proposals were ruled and approved in-session and all three shipped
    this cycle, one modified in placement because the section the operator named had never
    held the rule. Three further patterns were held back by the learning agent as not yet
    meeting its evidence bar. A full census of the ledger found two older statuses stale in
    ways the agent's own housecleaning had missed; see findings 1 and 2.

