instrument_liveness:
  silent_failures_observed: 10
  caught_by_control: 1
  caught_by_review: 5
  caught_by_contradiction: 4
  notes: >-
    Hand-classified. The control catch is the guard re-measure, where a field the planned
    fix depended on read empty (finding 8). Four review catches are serious defects in the
    new close helper found before it shipped; the fifth is the sweep that found the prior
    cycle's findings on no work list. The four contradiction catches are the housecleaning
    count, the unfiled approved build, the rule whose recorded home never held it, and a
    verification command whose exit status was silently replaced by a pipe's.

