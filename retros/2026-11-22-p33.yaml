discipline_metrics:
  ritual_steps_defined: 17
  ritual_steps_completed: 16
  notes: 'Seventeen steps defined, continuing the prior cycle''s correction rather than re-deriving
    it: the step text lists sixteen and the unit defines seventeen, the missing one being
    the fold step. Steps completed is published NULL here because the publication step runs
    after this file is authored and writes it then; null is the schema''s nullable form and
    renders as no data, where an absent key would render as an em-dash. The marker figures
    are TURN-denominated: three hundred and sixty-six substantive graded turns, thirty missed,
    an eight percent miss rate. The blocking-fires figure of two hundred and seventy-three
    is a count of HOOK FIRES and not of missed turns, because every fire inside a long agentic
    turn re-grades the same last-completed turn; it keeps its own field name so the two cannot
    be read as one series. The monthly housekeeping pass is not due, a retrospective having
    already run this calendar month. STEPS COMPLETED, WRITTEN AT 9(c): sixteen of seventeen,
    AND THE STEP IS NAMED RATHER THAN LEFT TO INFERENCE, because a bare sixteen matching the
    prior cycle''s sixteen would be a coincidence read as a series -- the trap this cycle
    filed as finding p33-4. The step not completed is the PROPAGATION step, the same step
    the prior cycle left incomplete, so the figure IS continuous: roughly a dozen owed promotions
    carried from earlier in the window were deliberately deferred onto ledger rows with release
    conditions, on the operator''s ruling that the cycle closes on what it actually did rather
    than widening to absorb them. ⛔ A FIRST DRAFT OF THIS NOTE NAMED THE MONTHLY HOUSEKEEPING
    SUB-RITUAL AS THE INCOMPLETE STEP AND WAS WRONG: housekeeping is NOT DUE, which is a different
    category from incomplete and is tracked by its own two fields. The deferral chain for
    that pass was walked by hand back to 2026-11-01, which ran it, so the not-due verdict
    is earned rather than inherited from a banner that cannot distinguish a cycle which ran
    housekeeping from one that skipped it. Step 9(b)''s documented skip-pass is counted as
    a COMPLETION with a stated disposition, not as an incompletion: no public narrative companion
    has existed for any cycle since 2026-05-13, so authoring one here would have started a
    series mid-ritual.'
