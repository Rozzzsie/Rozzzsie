  silent_failures_observed: 8
  caught_by_control: 2
  caught_by_review: 1
  caught_by_contradiction: 4
  notes: 'Hand-classified, and THE ARMS DO NOT SUM TO THE TOTAL: seven against eight, the
    same published gap as the prior cycle and for the same structural reason. The eighth was
    caught by a commit-time gate, and this block''s three arms are control, review and contradiction,
    none of which a gate is; reassigning it would close the sum and misdescribe the detection,
    so the gap is published rather than closed. By contradiction: a date comparator that classified
    an entry dated today as legacy, a producer that exited zero with empty output because
    its entry point was never called, a uniqueness check that refused on a genuinely duplicated
    heading, and a check-label sweep that disagreed with a published figure. By control: two
    predicates for the armed column, each refuted by a control that stated its expected value
    before running. By review: a confidentiality assertion whose scope was read back and found
    to cover the whole file rather than the inserted text. By gate: a sidecar whose sub-keys
    had been re-authored rather than inherited, refused by the schema''s drift guard. SEVEN
    OF THE EIGHT RETURNED A PLAUSIBLE RESULT RATHER THAN AN ERROR, which is the recurring
    shape of this block across cycles.'
