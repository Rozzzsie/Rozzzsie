    with a published figure, which is a thin reason to catch something; had the prior cycle
    published nothing, sixteen would have shipped.'
  arms_unit: distinct validator scripts invoked by the two commit-boundary hooks
  arms_unit_note: 'SERIES BREAK ON THE ARMED COLUMN, DECLARED, AND IT IS A BREAK OF REPRODUCIBILITY
    RATHER THAN OF COVERAGE - finding p33-4. Built reproduces exactly at twenty-one, counted
    from non-comment references across the two commit-boundary hooks with every path tested
    on disk. The armed column does not reproduce: the prior cycle published thirteen on a
    premise of EIGHT arms invoked scoped to the staged file set and therefore vacuous when
    that set holds no file of the kind they grade, and it listed none of those eight by name.
    Re-derivation under that same stated predicate finds THREE gated arms, giving eighteen
    unconditionally armed. The three are the blocker-row-tag validator and the open-items
    region warner, both gated on the staged open-items target list, and the entry-stamp validator,
    gated on its own staged target list. The eight cannot be reconciled against these three
    without the prior cycle''s member list, and the honest reading of the pair is that one
    predicate is wider than the other, NOT that six arms were disarmed this week. The prior
    cycle closed this exact residual one level up, publishing the built members for the first
    time; the gated subset silently inherited it, which is why the members are named here
    in prose so the next cycle can reproduce or refute eighteen. Separately, a THIRD predicate
    was tried and abandoned after its own positive control refuted it: counting arms whose
    failure reaches a non-zero exit returns twenty, because several blocking exits belong
    to key-retirement guards that fire when a validator''s path leaves the index rather than
    when its finding fails. That is a different question and is not published as this metric.'
  measured_at: '2026-11-22'
  measured_from: the two commit-boundary hooks and the stop gate's check headers, read directly
  notes: No arm was added or retired this cycle. The one genuine change is that the gated
