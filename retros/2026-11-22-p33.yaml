meta_finding: 'THE CYCLE''S OWN MEASUREMENTS PRODUCED MOST OF ITS FINDINGS, AND TWO OF THEM
  ARE ABOUT METRICS THIS SIDECAR PUBLISHES. The enforcement-miss bucket returns zero because
  the vocabulary it counts has never been written, and the external-validator counter returns
  five hundred and sixty because it matches a literal inside a file re-injected on every tool
  call. Both are published rather than suppressed, on the operator''s ruling, each with its
  bound named in the block that carries it. A third finding is a recurrence: the prior cycle
  recorded that the commit-boundary hooks defeat a naive sweep, and this cycle reproduced
  that sweep''s blindness twice, because the remedy had been a record rather than an amendment
  to the measuring procedure. The cycle folded twelve promoted entries into their bands, took
  three operator rulings, and deferred roughly a dozen owed promotions and two version bumps
  onto ledger rows with release conditions stated, rather than shipping them inside the ritual.'
