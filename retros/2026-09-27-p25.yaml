instrument_liveness:
  silent_failures_observed: 12
  caught_by_control: 4
  caught_by_review: 3
  caught_by_contradiction: 5
  notes: >-
    Hand-classified; the three arms sum to the total. The four control catches:
    - an eye spot-check found that a field-validity pass had folded absent into invalid;
    - an existence test found that a draft credited a validator already deleted;
    - a coverage guard caught a judge certifying coverage it had not performed;
    - running a gate's own emit as a deciding test showed its live records classed as
      fixtures.
    The three review catches, the first non-zero review arm in three cycles:
    - two rounds of external review, each finding the new fixture exemption still too broad;
    - the learning agent found a protocol-step citation that did not reproduce.
    The five contradiction catches:
    - session-log attribution by heading against attribution by id;
    - a dispatch capture record reading zero against a hook log reading one;
    - a silence flag against the hook's own action values;
    - a settings counterfactual whose result contradicted the removed key, because the
      setting had already loaded;
    - two counts of this window's learning entries (54 across 19 files against 56 across
      18). This one is unattributed: which count is wrong has not been established.

detection_provenance:
  caught_by_control: 2
  caught_by_operator: 0
  caught_by_accident: 0
  instrumented_from: p18
  status: measured
  relation_to_detection_source_distribution: >-
    Same question, different population; read the two together or neither. This block grades
    the findings in this retro in three buckets. The distribution block grades learning entries
    across the cycle in its own buckets. The vocabularies are not yet mapped, the denominators
    differ by construction, and the two will not sum. This one is the long-running series and
    stays the trend card.
  notes: >-
    Two of ten findings were caught by a control: the deciding-test emit in finding 3 and the
    coverage guard in finding 4. None was caught by the operator, the third consecutive zero on
    that arm; the operator's contribution this cycle was rulings and an explanation, not
    catches. None was caught by accident. The other eight came from a self-run census,
    contradictions between figures, or learning-agent review, none of which this three-bucket
    block grades.

