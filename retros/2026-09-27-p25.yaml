  threshold_sec: 120
  threshold_violations: 19
  notes: >-
    Latency rose: p95 went from 158 to 452 seconds, the maximum from 791 to 2181, and threshold
    violations from 8 to 19. The operator explained this. The startup briefing is sometimes
    delivered after a first round of probes rather than before it, which counts as a slow
    first tool call. The operator accepts that ordering because the first turn produces
    working-tree progress rather than preamble. Recorded as explained, not investigated. The
    figure is therefore not a health signal this cycle.

