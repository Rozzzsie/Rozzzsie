# Meta-finding — the renderer's hero callout. The cycle's one-line lesson.
meta_finding:
  headline: "The cycle's theme — SELECTORS EVERYWHERE, VALIDATORS NOWHERE (a claim, a status, a green test, a 'done' dispatch, an empty grep — each trusted as a conclusion without a check against the artifact) — was found in the OS's OWN governance bookkeeping: seven executed rule-proposals from a prior cycle still read 'pending' because the per-proposal status header was a selector nobody had reconciled against the execution ledger that recorded them shipped. The retro caught its own surface exhibiting the class it was auditing, and reconciled it. The three rules promoted this cycle each INSTALL A VALIDATOR where a selector had been trusted: (1) prove a test harness's fail-arm can actually fire — and exercise the degradation SEQUENCE end-to-end — before trusting a green suite; (2) run a positive control that proves your query CAN find a known instance before reading an empty grep as absence, and query structured logs by field, never bare substring; (3) a dispatched subagent's completion is not delivery until its return ARTIFACT is verified to exist. Named the lesson: a selector says how to fix; only a validator tells you it broke — and the highest-leverage governance work of a mature OS is giving every trusted selector a trigger that checks it against the artifact."

findings:
  # Item A — the recurring class, this cycle's center of gravity
  - id: "2.1"
    title: "THE CYCLE'S HEADLINE CLASS (n=6, cross-cycle) — 'selectors everywhere, validators nowhere': a status / claim / comment / green test trusted as a conclusion without a validator that checks it against the artifact. In-window instances: a backlog item's gate left reading 'design pass in progress' after its own close cascade; a stale title-claim on a resolved item; outbound-doc tense / origin / deployed-vs-testing corrections (all operator-caught); a born-false prerequisite claim; a wrong-path write that returned 'success'. Same class the prior week's full-sweep adversarial audit named at scale. The three rule promotions below each target a facet of it; the reconciliation (item 5.2) found the OS's own proposal bookkeeping exhibiting it."
    category: "meta-observation"
    evidence_count: 6
    source_catchment: "changelog-sweep + adversarial-audit-continuity + operator-catches"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-07-19"
    target_surface: "addressed via the three rule promotions (2.2 / 2.3 / 1.1) + the bookkeeping reconciliation (5.2)"

  # Item B — T2 green-suite-not-tested-contract
  - id: "2.2"
    title: "PROMOTED to doctrine (learning-layer, operator-gated) — GREEN SUITE ≠ TESTED CONTRACT: test the degradation SEQUENCE, not each branch; and prove the fail-arm can fire. (1) When a system has a fallback / degradation ladder (provider fallback, retry sequence, tiered gate), passing tests must exercise the SEQUENCE end-to-end — each rung green in isolation does not prove the ladder degrades correctly, and mocks that stub the integration hide the exact seam the ladder depends on. (2) A test harness whose fail-arm cannot fire proves nothing: before trusting a green result, feed a known-bad input and watch the assertion fail. Self-consistent fixtures + a non-firing fail-arm is how a dead extractor passes green. Reviewer rider: point the reviewer at the untested critical parameter the ladder actually turns on, not the branches already green. The test-harness sibling of the executed clean-path governance-gate-fireability rule."
    category: "rule-extension"
    evidence_count: 3
    source_catchment: "learning-layer-proposal + insights-buffer"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-07-19"
    target_surface: "output-checklist ready-to-use cluster — degradation-sequence + prove-the-fail-arm-can-fire"

  # Item C — T3 grep-mechanics extension
  - id: "2.3"
    title: "PROMOTED to doctrine (learning-layer, operator-gated) — GREP MECHANICS for structured artifacts + absence-claims (extends the grep-discipline section). Two rules: (a) query JSONL / structured logs by their STRUCTURAL FIELD (a field-scoped selector), never a bare substring that can match across field boundaries or miss field-scoped values; a filter-exclusion on structured data can silently drop a real row, so verify the row count against a structural query. (b) POSITIVE CONTROL before an absence-claim: before asserting 'X is absent' from an empty grep, run a control that proves the query CAN find a known-present instance — an empty result from an unproven query is INDETERMINATE, not absence; grep the concept AND its synonyms, not one literal term. The mechanics half of the standing verify-to-artifact cluster; cross-referenced so grep-methodology lives here and surrogate-reasoning stays in the cluster."
    category: "rule-extension"
    evidence_count: 3
    source_catchment: "learning-layer-proposal + insights-buffer + retro-candidate-pre-queue"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-07-19"
    target_surface: "output-checklist grep-discipline section — JSONL structural-field query + positive-control-before-absence"

  # Item D — T1 completion-not-delivery (queued to the bundled bump)
  - id: "1.1"
    title: "APPROVED, QUEUED (operator-gated) — COMPLETION ≠ DELIVERY for subagent returns: file-handoff is the primary return channel, the chat message is a pointer, not the payload. A dispatched subagent's return must land in a durable file the orchestrator reads; before treating a dispatch as complete, verify the return artifact EXISTS (the arrival check) — a dispatch with no readable return artifact is INDETERMINATE, not done. Sub-rule for async / teams-mode: when a synchronous-return flag is not honored (the deputy idles instead of returning), the missing arrival signal is the tell — poll the expected return-file rather than waiting on a message that may never route. Closes the one genuinely UNPROPAGATED learning this cycle (n=3 across distinct sessions, zero prior governance landing). Honest scope: the idle itself is a harness behavior the rule MITIGATES (mandate file-handoff + arrival poll), not a doctrine-closable bug. Bundled with the carried orchestration fan-out-cost rule onto ONE governance version bump + adversarial pass — same section, different axis (reliability vs cost)."
    category: "rule-extension"
    evidence_count: 3
    source_catchment: "learning-layer-proposal + LEARNINGS-delta (the unpropagated cluster) + insights-buffer"
    recommendation: "accept"
    status: "approved-queued"
    execution_target_week: "next-version-bump"
    target_surface: "orchestration governance doc — subagent dispatch/relay-reliability (arrival check), bundled with the fan-out-cost rule"

  # Item E — checkpoint discipline ticked up on a build-heavy cycle
  - id: "4.1"
    title: "checkpoint-discipline miss-rate 0.26 cycle-wide (881/3359 substantive turns) — a mild UPTICK from last cycle's 0.22 (trend 0.28 → 0.26 → 0.34 → 0.22 → 0.26), driven by a build-heavy cycle: a synthetic-harness build arc plus heavy async deputy fan-out (both known high-miss modes — long tool-cascades and async/deputy-completion turns). The average moves with the ship-load; the enforce-gate that would close it stays BUILD-QUEUED, downstream of a reset-path build + a consultant reframe, and was NOT re-decided this cycle. Self-reported per-session counts ran honest and, this cycle, IMPROVED to firelog-exact on the sampled traces (the prior ~10–25% peak-understatement resolved wherever the firelog was used as ground truth) — the tally remains the calibration basis. Feeds the enforce-gate arming-threshold calibration."
    category: "meta-observation"
    evidence_count: 1
    source_catchment: "discipline-metric-tally + session-meta"
    recommendation: "watch"
    status: "deferred"
    execution_target_week: "backlog"
    target_surface: "feeds the build-queued enforce-gate arming calibration"

  # Item F — discipline audit clean; checkpoint-honesty improved
  - id: "5.1"
    title: "discipline audit CLEAN where it counts — all 3 sampled quality-gate traces PASS (real productive filenames, non-generic verify-to-artifact evidence, checkpoint-bar section present; zero trace-quality escalation); intent-confirmation discipline had zero skips across the window; loop-detection + learning-propagation tagging clean; and propagation hygiene was strong (10/10 spot-checked in-window learnings verified landed at their target artifact, not trusted from the entry's own prose). Checkpoint-bar honesty IMPROVED this cycle — two of three sampled traces moved to firelog-exact miss counts. The cross-model reviewer was usage-capped this window; the adversarial auditor carried review solo and the degrade-ladder held."
    category: "meta-observation"
    evidence_count: 3
    source_catchment: "session-log-audit + trace-sample-audit + propagation-audit"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-07-19"
    target_surface: "no action — health signal"

  # Item G — the OS's own bookkeeping exhibited the headline class (reconciled)
  - id: "5.2"
    title: "RECONCILED (operator-gated) — the OS's own rule-proposal bookkeeping exhibited the cycle's headline class. Seven proposals from a prior cycle were accepted + executed (verified: landings confirmed at their target doctrine surfaces + a separate execution-ledger record), yet their per-proposal STATUS headers still read 'pending' — the status field was a selector nobody had reconciled against the execution ledger that recorded them shipped. Effect: the pending-count over-reported and the learning-layer agent's duplicate-suppression grep could misread executed rules as open. Verified each to its landing artifact, then reconciled all seven status headers to 'executed'. A cheap, honest fix — and the sharpest in-house instance of item 2.1 this cycle."
    category: "meta-observation"
    evidence_count: 7
    source_catchment: "proposal-lifecycle-audit + verify-to-artifact"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-07-19"
    target_surface: "rule-proposal file — per-proposal status headers reconciled to the execution ledger"

