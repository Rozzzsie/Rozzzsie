window_end: '2026-10-25'
trigger_source: session-start-overdue-flag-interactive
interactive_mode: true

meta_finding: >-
  This cycle's findings share one shape: a surface that teaches or records a form, read by a
  party that takes the form to mean something it does not. The intent-confirmation template
  showed a skip line for explicit instructions, and the stop gate blocks exactly that line at
  three or more productive files, so four sessions followed the template and could not close. A
  team-set label in a ticket export was read nine times as its meaning, and the operator
  corrected each one. The metrics tally again counted mentions of a launch command as 306
  launches. Insight cards record the folder a session ran from, which is the same folder for
  every workspace, so the field cannot say which workspace a card came from. In each case the
  form was faithful and the reading was wrong. The template, the label rule and the close rule
  were fixed this cycle; the gate half, the tally and the card field are on ledgers.

findings:
  - id: p29-1
    title: The intent-confirmation template taught a skip line that the stop gate blocks, and four sessions followed it
    category: class-recurrence
    evidence_count: 4
    source_catchment: a retro candidate at its fourth recurrence, traced by the insights read to two template lines, then a learning-agent proposal checked against the gate's code
    recommendation: fix
    status: partial-executed
    execution_target_week: '2026-11-01'
    target_surface: the intent-confirmation protocol, the protocol index's log-format block, and the stop gate
    detail_ref: >-
      The template told a session given an explicit instruction to log its intent as skipped. The
      gate treats a skip at three or more productive files as a missing confirmation, and no later
      line repairs it, so a session that did the right work by the template could not close. On
      the operator's ruling the template was fixed this cycle: an explicit instruction is logged
      as confirmed, quoting the operator's words, and skip is kept for trivial acts. Both units
      were version-bumped and adversarially reviewed. The gate half, letting a session's latest
      line decide, is a backlog row, because gate code needs two cross-model reviews and a test
      run before and after.

  - id: p29-2
    title: A team-set label was read as its meaning nine times in about five days, despite a pinned rule
    category: class-recurrence
    evidence_count: 9
    source_catchment: the change-log pull across workspaces, then a learning-agent proposal checked against the checklist section
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-25'
    target_surface: the output checklist's surrogate section, its act-routing table, and one workspace rule file
    detail_ref: >-
      The pinned rule says a field's name is not its meaning, and it was phrased around fields
      and verdicts. The repeated case was a tag someone else sets, used as a ranking key or a
      filter, where the label has no description, only its setter. The rule now names that case
      and says to ask the setter once before keying on it, expecting errors in both directions.
      No act row reached the section for that act, so one was added. The workspace where it
      recurred gained a rule that a generated column's wording is not a product term.

  - id: p29-3
    title: Work that existed only in chat, a scratch folder or an unanswered offer ended its session three times
    category: convergence-gap
    evidence_count: 3
    source_catchment: the change-log pull, the learning delta and a retro candidate, merged into one learning-agent proposal
    recommendation: fix
    status: executed
    execution_target_week: '2026-10-25'
    target_surface: the session-close protocol
    detail_ref: >-
      An agreed plan, a generator script and an offered grade were each lost or nearly lost at a
      session boundary, in two workspaces. The close protocol now treats all three as not yet
      produced: a plan is filed with a pointer, a scratch script moves to the workspace, and the
      session re-reads its own turns for offers nobody took up, saying in its trace which applied.
      The protocol was version-bumped and adversarially reviewed.

  - id: p29-4
    title: The time-claims candidate was closed as watched after a quiet window
    category: class-recurrence
    evidence_count: 0
    source_catchment: a learning-agent proposal with the step-5.5 rate for its retro candidate
    recommendation: watch
    status: executed
    execution_target_week: '2026-10-25'
    target_surface: the retro-candidate ledger
    detail_ref: >-
      The prose arm had no in-window instance and about twenty zone conversions checked were all
      correct. The operator chose to close the candidate with no checklist rider. A code-side
      lesson about deriving a date from a timestamp went to the rule file of the one workspace
      where it occurred, which keeps its own containment boundary.

  - id: p29-5
    title: Two deputies hit the state-file write gate on plain reads and got the content another way
    category: design-gap
    evidence_count: 2
    source_catchment: two deputy returns that flagged the denial instead of deciding it, then a learning-agent deferred item
    recommendation: fix
    status: approved
    execution_target_week: '2026-11-01'
    target_surface: the state-file write gate and the deputy brief
    detail_ref: >-
      A gate meant to stop writes to state files also denied reads, and the deputies reached the
      same content through whole-commit views and scratch scripts. The operator did not object to
      the default: a backlog row scopes the gate's read arm, and deputy briefs now say not to
      route around the gate, but to report a denied read and stop that read.

  - id: p29-6
    title: The metrics tally counted 306 launches of an external validator that cannot be launched by the agent
    category: instrument-validity
    evidence_count: 306
    source_catchment: the mandated tally, compared with last cycle's finding and its open backlog row
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-11-01'
    target_surface: the sidecar metrics tally's typed-command arm
    detail_ref: >-
      Same mechanism as last cycle: every count came from the typed-command route, which the
      always-loaded rules quote. Real launches on that route were zero. This sidecar publishes the
      other validator's 11 by hand. The fix, keying the count on a structure only a real launch
      leaves, is last cycle's backlog row and is not built.

  - id: p29-7
    title: Six of sixteen gradeable entries skipped the routing judgement, and seeded lessons are promoted but not cited
    category: measurement-gap
    evidence_count: 6
    source_catchment: the routing census over the window
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-11-01'
    target_surface: the cross-pollination protocol's routing line
    detail_ref: >-
      The share is worse than last cycle's 7 of 37, but the gradeable pool shrank by more than
      half, so part of the rise is a smaller denominator. Cumulatively 43 seeded lessons have
      arrived, 9 were promoted where they landed, and none was cited. Of 12 arrivals this window
      none was acted on yet, and the oldest is five days old.

  - id: p29-8
    title: A cross-model review ran after its commit twice in one day
    category: class-recurrence
    evidence_count: 2
    source_catchment: the change-log pull
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-11-01'
    target_surface: the cross-model review protocol
    detail_ref: >-
      The rule says review before commit. Both cases were in one workspace on one day, below the
      learning agent's threshold, and it was deferred.

  - id: p29-9
    title: Insight cards cannot be attributed to a workspace by their recorded location
    category: measurement-gap
    evidence_count: 95
    source_catchment: the insights-buffer read
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-11-01'
    target_surface: the insights capture hook and the learning agent's contract
    detail_ref: >-
      All 95 in-window cards record the same folder, because every session runs from the
      workspace root. The learning agent's contract describes that field as what makes a card
      attributable to a workspace, which matters for keeping private workspaces' cards out of
      shared surfaces. The deputy read every card to sort them. The defect is on an open backlog
      row about the learning agent's catchment.

  - id: p29-10
    title: The consultant had no dispatch for the third cycle running
    category: measurement-gap
    evidence_count: 0
    source_catchment: the session-log audit and the consultant capture files
    recommendation: watch
    status: carried-open
    execution_target_week: '2026-11-01'
    target_surface: the consultant receipt convention
    detail_ref: >-
      Zero dispatches and zero receipts, so all six health metrics have a zero denominator, which
      is unmeasured rather than zero.

proposal_backlog:
  authored_this_cycle: 4
  deferred_this_cycle: 4
  notes: >-
    The learning agent wrote four proposals and deferred four items. All four proposals were
    checked against their cited sources before they reached the operator. The first was accepted
    in part, template now and gate later; the second and third were accepted as recommended; the
    fourth was closed with no rider. One proposal drew its evidence from a private workspace whose
    own rule bars promoting from it, and the operator ruled that the learning agent may count that
    workspace's entries as catchment but never propose from them alone. One deferred item, the
    write gate's read arm, became a backlog row as the default the operator did not object to.

hook_health:
  silent_hooks_observed: 3
  absent_hooks_observed: 0
  audit_instrument_defects_found: 1
  enforcement_flips_verified_this_cycle: 0
  notes: >-
    Measured over a rolling seven days. Three hooks flagged silent. Two are carried: the identity
    hook, healthy, whose result words the auditor does not recognise, and the sub-agent return
    guard. The third is new: a hook's five records all come from one install-day probe and carry a
    value the auditor does not map, so it is counted as one auditor defect rather than a broken
    hook. The flip reviews ran before the retro presentation this cycle. The send-retraction gate
    auto-approved 45 calls to tools it has no category for, as designed; one could act in a
    browser, down from 16 last cycle. The checkpoint ack gate did not flip.

