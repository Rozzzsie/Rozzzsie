#
# Mode this cycle: a DECISION retro. After six-plus cycles of HELD, the
# checkpoint acknowledgement-gate enforce-flip moved to BUILD — because the
# consultant rail reframed the blocking prerequisite. The gate had been held on a
# separate "friction-relief" ship; the reframe showed that ARMING THE GATE NARROWLY
# (teeth only on the clusters doctrine already declares self-discipline-dead:
# post-compaction, long wrap-arcs, async-completion turns) IS the friction relief —
# a legitimate long work-arc is a non-cluster arc, so a cluster-scoped gate
# structurally cannot fire during it. That collapsed the prerequisite into the
# scoping choice and unblocked the build.
#
# Honest headline on the trend line: checkpoint-discipline miss rate IMPROVED to
# 0.22 (from 0.34 last cycle) — but the worst single-session barless run HELD at 78
# (one build-heavy session logged 127 corrective fires). The average got better;
# the PEAK CLUSTERS did not. That split is exactly why the gate is being armed
# narrow (at the clusters) rather than uniform — and it recurred live in THIS
# retro session, fresh n+1 that the peaks are structural, not knowledge-triggered.
#
# This is the 12th P10 retro sidecar in the multi-retro rendering era (n=12 after this ship).

