defect_ledger:
  measured_at: "2026-08-16 17:1x"
  measured_from: "governance status file — rows returned by the live escalator extractor, not by reading the file"
  open_total: 67
  age_under_7d: 13
  age_7_to_29d: 53
  age_30d_plus: 0
  age_undated: 1
  median_age_days: 14
  max_age_days: 26
  notes: >
    ⭐ THE AGE GROUP IS RE-DERIVED THIS CYCLE RATHER THAN CARRIED. The prior cycle published the
    total and deliberately omitted the distribution, on the correct ground that carrying stale
    ages forward would be a stale measurement wearing a current timestamp. This cycle the six
    keys are enforced as a group and are measured; the buckets sum exactly to the total, which
    is stated as a control rather than assumed.

    ⚠️ AN HONEST BOUND ON WHAT THESE AGES MEAN, AND IT WEAKENS THEM. The age of a row is taken
    from the most recent date appearing in that row's text. For a row that has been UPDATED,
    that is its last-touched date and not its filed date. So `age_30d_plus: 0` and a maximum of
    26 days are a FLOOR on the board's true age, not a finding about it — an actively-maintained
    old row is indistinguishable here from a new one. Published with the bound stated rather
    than either suppressed or presented as a clean result.

    DELIBERATELY UNSCORED, for the reason established two cycles ago: a governance architecture
    that scored itself on defect count would score highest with its instruments switched off,
    and every audit that worked would lower the number.

    ⚠️ AND THE TOTAL REMAINS A CLASSIFIER OUTPUT, NOT A COUNT OF WHAT EXISTS. The extractor's
    region anchor is a literal heading, and a full audit this window measured the consequence:
    of twelve workspaces, five render zero and have no such rows at all, six are correct, and
    ONE HOLDS TWO LIVE LEDGERS — 80 rows under a heading the extractor ignores and 14 under the
    one it reads — so the instrument publishes the smaller and cannot report that it ignored the
    larger. That audit also found that an earlier audit of the same defect returned a FALSE
    CLEAN, because it computed rows-in-region using the extractor's own anchor: instrument and
    subject corroborating each other.

