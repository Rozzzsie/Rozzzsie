    ⛔ SEVEN FIRES ON ONE GRADED TURN. Every one of the seven blocking records carried an
    IDENTICAL per-turn signature, so they are the same turn re-graded seven times, not seven
    missed turns. Divided by that signature the figure is ONE missed turn — the post-compaction
