# P10 Retro Sidecar — 2026-08-16 (P10 retro #19, sanitized public snapshot)
#
# Window 2026-08-09 → 2026-08-16 (7 days). Not the first retro of the month, so the
# monthly housecleaning sub-ritual does not fire; only the ten weekly steps are in scope.
# Stakeholder names genericized to role-class; workspace names genericized per the public
# workspace table; private personal-track + career-track + capital-track references dropped
# entirely; evidence citations to private files, commit hashes, hook filenames, thread IDs,
# internal item numbers, exact protocol version strings, and product internals stripped.
#
# Schema: `dashboard/render.py` § SIDECAR_SCHEMA — the enforced contract (rc=3 on a missing
# required field). `schema_version` records which revision this file was authored against.
#
# ⭐ THIS IS THE FIRST SIDECAR AUTHORED UNDER `required_groups`, AN ARM ADDED THIS CYCLE.
# Two blocks — the defect age distribution and the latency observations — are now enforced
# as COMPLETE GROUPS rather than as individually-optional keys, because each lost all six of
# its keys at once in consecutive prior cycles and no check could see it. Every one of those
# twelve keys below is MEASURED THIS CYCLE. The asymmetry is deliberate: present-and-null
# passes, absent fails, so the arm can never create pressure to invent a reading.
#
# Narrative companion: SKIP-PASS, same reason as p9–p18 — the centre of gravity IS governance,
# so the findings below ARE the cycle's substance.
#
# Mode this cycle: the ritual was run in place of a scheduled design arc at the operator's
# direction. Its finding is not a new failure class but the DIRECTION OF ONE ALREADY KNOWN:
# every figure that went wrong this week was correctly labelled as unverified by whoever
# passed it on, and the label stopped nothing.

