    denominator, consistent with the prior cycle's correction and NOT comparable to any cycle
    before it. Reported at the corrected value even though the correction makes the number look
    better, on the standing ground that a wrong number in the alarming direction survives by
    rewarding the work that produced it.

    ⛔ RE-MEASURED AT SESSION CLOSE, AND THE RE-MEASUREMENT IS THE POINT. This block first
    published 6 graded turns / 7 fires / 0.166 while the ritual was still running. By close the
    same session had reached 9 graded turns and 120 fires — a 13x fire-to-turn inflation and a
    materially different denominator, against an unchanged numerator of ONE genuinely missed
    turn. THE PRIOR CYCLE RECORDED EXACTLY THIS DEFECT AS A RITUAL-ORDERING PROBLEM: this file
    is published at step 9 while facts it reports keep moving until step 10. That finding is
    honoured here rather than reproduced — the figures are re-derived at close and the
    measurement boundary is stated in the data rather than left implicit.

    Both figures were produced by the EXISTING per-turn collapse function rather than by a
    hand-written reducer, which is the fix proposed this cycle and parked; using it here cost
    nothing and is the first time this series has been authored that way.
