meta_finding: >
  A PROVENANCE LABEL IS NOT A VERIFICATION GATE. An unverified figure was handed to the
  learning-layer agent, which did everything correctly — it used the figure, attributed it,
  and stated in writing that it could not check it. The figure still hardened into three
  separate places in a published proposal. Attribution preserves accountability and does
  nothing whatsoever to stop propagation: a disclaimed number travels exactly as far as an
  undisclaimed one and arrives wearing a caveat that reads as diligence. The same figure then
  passed through a fourth hop, to the consultant rail, which again labelled it correctly and
  again could not stop it. Four hops, four correct labels, one wrong number.

  The sharper half is the learning agent's own: A RATIO IS ONE CLAIM, NOT TWO. It audited the
  pair, corrected the numerator, and flagged the denominator as unverified — and thereby moved
  the published figure FURTHER from the truth than leaving both alone would have, because the
  half that was checked lends its credibility to the half that was not. The flag read as
  caution and functioned as a pass.

  Corrected, the finding is stronger than either original: not a rate but a DEATH DATE. The
  observability convention it measures has been dead since a specific day three weeks ago. A
  rate invites "tighten the discipline"; a date asks what changed on a particular day, which
  is a question with an answer.

findings:
  - id: "1.1"
    title: "A PROVENANCE LABEL IS NOT A VERIFICATION GATE, AND FOUR CORRECT LABELS DID NOT STOP ONE WRONG NUMBER. An unverified count was passed from the orchestrator to the learning-layer agent, which used it, attributed it, and stated explicitly that it could not check it; the figure hardened into three places in that agent's published proposal. It then passed to the consultant rail, which again labelled it correctly and again did not stop it. The number was wrong in three independent ways: wrong magnitude, wrong denominator scope, and a corpus-state mismatch between its two halves with neither half labelled — so the published ratio described a state that never existed. THE LOAD-BEARING ERROR WAS THE DENOMINATOR: a named-rail numerator was paired against an all-dispatch corpus, most of whose members were never owed the thing being counted. That is a join-key error, committed on a figure the author generated himself. Corrective direction: verify BEFORE handing a figure to a deputy; labelling it afterward is a receipt for a check nobody ran."
    category: "measurement-integrity"
    evidence_count: 4
    source_catchment: "cross-agent-reconciliation"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-08-16"
    target_surface: "cross-workspace knowledge file; the proposal's evidence bullet corrected OF RECORD rather than silently"

  - id: "1.2"
    title: "A RATIO IS ONE CLAIM, NOT TWO — CORRECTING ONE HALF WHILE TRUSTING THE OTHER MOVED THE PUBLISHED FIGURE FURTHER FROM THE TRUTH THAN LEAVING BOTH ALONE. The learning-layer agent audited a ratio it had been handed, corrected the numerator upward on its own independent census, and flagged the denominator as the orchestrator's and unverified. Both acts were individually correct and locally defensible. The result was worse than inaction, because a one-sided correction transfers the credibility of the checked half onto the unchecked half, and the unverified-flag reads as caution while functioning as a pass. The agent banked this against itself in the proposal rather than quietly fixing the number, which is why it is publishable. Corrective direction: audit a ratio as ONE object — numerator, denominator, and the corpus state of each — or leave it whole and say so."
    category: "measurement-integrity"
    evidence_count: 1
    source_catchment: "learning-agent-self-audit"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-08-16"
    target_surface: "cross-workspace knowledge file; proposal lifecycle log"

  - id: "1.3"
    title: "A CORRECT RECOMMENDATION CAN REST ON A WRONG PREMISE, AND THE CONCLUSION SURVIVES EVERY CHECK YOU RUN ON IT. A routing recommendation was argued on the grounds that a governance file sat at 94.5 percent of its enforced size bound with roughly four sessions of headroom. Measured, it was at 84.92 percent with 22,614 units of headroom — the premise was ten points off. THE RECOMMENDATION WAS STILL RIGHT, because the true figure sits 0.08 points under the warn threshold, so a substantial addition trips it anyway. This is the hardest shape to catch: agreeing with a conclusion is not evidence about its premise, and every check aimed at the conclusion confirms it. Corrective direction: when you accept a recommendation, state which of its premises you actually verified — accepting the routing and verifying the bound are two different facts."
    category: "measurement-integrity"
    evidence_count: 1
    source_catchment: "self-audit-during-ritual"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-08-16"
    target_surface: "cross-workspace knowledge file"

  - id: "2.1"
    title: "AN OBSERVABILITY CONVENTION IS NOT DECAYING — IT IS DEAD, AND IT HAS A DEATH DATE. A hand-written log line recording every named-rail agent invocation is consumed by a standing health audit and by a session-scoping gate. In-window the count is ZERO such lines against twelve named-rail dispatches: not a low rate, a total absence. Whole-file the practice yields seven lines since January, all of them clustered before a single day three weeks ago, after which nothing. One rail has never been covered by the convention at all. Separately, the same file's heading grammar has at least eight mutually incompatible live shapes while a gate keys on a literal heading prefix, and the file is unrotated since January at 4,500-plus lines — the only one of six audited governance surfaces with no size or shape discipline of any kind. THE AUDIT READS AN EMPTY SURFACE AND CANNOT REPORT THAT IT READ NOTHING: a zero tally does not surface as broken, it surfaces as a quiet week, because nothing compares it against the dispatches that actually occurred."
    category: "structural"
    evidence_count: 3
    source_catchment: "learning-agent-analysis"
    recommendation: "accept"
    status: "carried-open"
    execution_target_week: "next-cycle"
    target_surface: "operator ruled: extend the existing convention-drift rule, and retire the hand-written line in favour of artifacts that already exist; no new commit-gate arm. Parked to the improvement backlog with three carried constraints."

  - id: "2.2"
    title: "A TEST PINNED TO A VALUE THE SYSTEM INCREMENTS ON SCHEDULE HAS BEEN RED SINCE THE PREVIOUS CYCLE, AND NOTHING REPORTED IT. A dashboard test asserts a hard-coded corpus size against a corpus that grows by exactly one every retro cycle. It went red the moment the previous cycle published and has been red for seven days; verified on a clean tree, so it is independent of this cycle's changes. THIS IS DIRECT EVIDENCE FOR A CEREMONY STEP ADDED ONE DAY BEFORE THIS CYCLE — the step that requires running the test suites at every version bump and reading the result line — measured on the cycle immediately preceding it: the prior bump either never ran its suites or absorbed a red silently. The deeper defect is that an assertion pinned to a scheduled increment tests the calendar rather than behaviour; re-pinning buys exactly one week. Contrast with the arm shipped this cycle, which asserts a SHAPE (these six keys exist) and is stable across growth."
    category: "test-integrity"
    evidence_count: 1
    source_catchment: "build-step-verification"
    recommendation: "accept"
    status: "carried-open"
    execution_target_week: "next-cycle"
    target_surface: "dashboard test suite — operator decision pending on re-pin versus derive"

  - id: "3.1"
    title: "A VERIFICATION PREDICATE OF PRESENCE WHERE THE RIGHT ONE WAS ASSERTION — AND IT FLAGS THE MOST CAREFUL AUTHORS WHILE PASSING ANYONE WHO OVERWRITES SILENTLY. Checking that a correction had landed, the orchestrator swept for whether the wrong figure was PRESENT and got three hits, and was about to report a failure. All three sat inside the corrected region as CORRECTION RECORDS — contrastive statements of the old value beside the new, which is the house standard. The right predicate was whether the wrong figure was still ASSERTED. These two diverge precisely when someone corrects WELL, because good practice deliberately preserves the wrong number in contrastive form. A must-be-gone sweep is therefore the wrong instrument for any surface whose convention is relocate-don't-delete. Aggravator recorded rather than omitted: the same sweep was a whole-file count about to become a claim about ONE section — the wrong-region mechanism, committed one turn after correcting the same family in another agent."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "self-audit-during-ritual"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-08-16"
    target_surface: "cross-workspace knowledge file"

  - id: "4.1"
    title: "A PORTABILITY CONSTRAINT DOES NOT FIRE WHEN THE QUESTION PRESENTS AS ACCURACY, AND A DEPUTY INHERITS THE LEAD'S FRAME SILENTLY. A proposal to fix the accuracy of a self-audit instrument was relayed to the operator inside the frame it arrived in. The operator asked a single question — is this for portability — and exposed that the proposal OPTIMISES A MEASUREMENT WITHOUT ASKING WHETHER THE MEASUREMENT BELONGS WHERE IT LIVES. As scoped it would have made the architecture MORE coupled to one specific CLI, against a workspace whose stated value proposition is independence from any one vendor. The governing rule was already live and binding, and its own text nearly predicts the miss: it warns that the constraint fails to fire when a question presents as SECURITY, TOOLING or CONVENIENCE. ADD ACCURACY TO THAT LIST — it is the most disarming presentation of all, because making a number correct reads as strictly-good and frame-neutral, and nobody asks whether a bug fix has an architecture. THE DEPUTY COULD NOT HAVE CAUGHT THIS: a well-executed proposal inside the wrong frame is indistinguishable from a well-executed proposal, so the frame question is the lead's and must be asked BEFORE dispatch."
    category: "rule-extension"
    evidence_count: 2
    source_catchment: "operator-question"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-08-16"
    target_surface: "cross-workspace knowledge file; the affected proposal was held, reframed by the consultant rail, and parked"

  - id: "4.2"
    title: "THE CONSULTANT RAIL RETIRED THE QUESTION IT WAS ASKED RATHER THAN ANSWERING IT, AND THE REFRAME IS THE RESULT. Asked where a governance measurement should be STORED — vendor-specific log versus an artifact the architecture owns — the rail answered that storage is not the axis. The axis is HOW MANY PLACES KNOW HOW TO READ THE RECORD, currently three: a pure module, a bash recipe embedded in a mandated authoring template, and every author's head. Coupling is a function of that count, not of where the bytes sit: a pure function taking records and a session id is ALREADY substrate-neutral, while a bash recipe grepping a vendor log from inside a doctrine template is not and cannot be made so. Therefore the accuracy fix and the portability fix are THE SAME EDIT, landed in the module — with no fork of a 45,000-record historical series, so the must-not-change-what-it-counts contract is satisfied by construction rather than by argument. The rail also told the orchestrator, correctly, that he had over-corrected: routing an accuracy fix through a portability lens is a category error at the level asked, but the operator's question still earned its keep by RELOCATING the fix rather than reopening it."
    category: "structural"
    evidence_count: 1
    source_catchment: "consultant-rail-analysis"
    recommendation: "accept"
    status: "carried-open"
    execution_target_week: "next-cycle"
    target_surface: "operator accepted the reframe; parked to the improvement backlog with the honest costs attached"

  - id: "4.3"
    title: "A MANDATED AUTHORING TEMPLATE STATES ITS OWN LIMITATION BACKWARDS, AND NO CODE FIX TOUCHES IT. The template governing this OS's discipline-metrics authoring says the log yields an EXACT miss count but not an exact denominator, and instructs the author to report the denominator as unavailable rather than estimating it. Under a ruling made two days into this window, that is inverted: the exact numerator is exact in FIRES, which is the wrong unit, while the sanctioned degradation is applied to the half that is merely unmeasured. THE TEMPLATE THEREFORE LICENSES THE AUTHOR TO DISTRUST THE UNMEASURED HALF AND TRUST THE WRONGLY-MEASURED ONE. This was found by the consultant rail while reading source for a different question, and it is a DOCTRINE sentence rather than a code defect — no correction to the template's command recipe reaches it, so a fix that only rewrites the recipe would leave the inverted instruction standing directly beneath it."
    category: "measurement-integrity"
    evidence_count: 1
    source_catchment: "consultant-rail-analysis"
    recommendation: "accept"
    status: "carried-open"
    execution_target_week: "next-cycle"
    target_surface: "authoring template — must ship in the same edit as the instrument fix, filed that way on the backlog"

  - id: "5.1"
    title: "THE QUALITATIVE CATCHMENT SURFACE HAS GONE SILENT AND THE INSTRUMENT CANNOT SAY SO. The candidate queue that is meant to receive human-flagged retrospective material holds ZERO in-window entries; its newest is thirteen days old. Against 322 evidence cards and 250 knowledge-file deltas in the same window, that is roughly one receipt per 570 signal items, down from 629 the prior cycle. The learning-layer agent surfaced this and correctly declined to author a new proposal for it, folding it instead as strengthening evidence onto an existing open proposal about receipt surfaces — same trigger, same direction, so a new proposal would have forked it. Recorded here because a catchment surface that stops receiving does not report an error; it reports a quiet week, which is the same signature as finding 2.1 one layer up."
    category: "process-gap"
    evidence_count: 1
    source_catchment: "learning-agent-analysis"
    recommendation: "accept"
    status: "carried-open"
    execution_target_week: "next-cycle"
    target_surface: "existing open proposal on receipt surfaces — evidence added, not duplicated"

proposal_backlog:
  authored_this_cycle: 3
  deferred_this_cycle: 3
  notes: >
    The learning-layer agent ran on the evidence buffer, the candidate queue and the knowledge
    deltas. Six patterns cleared threshold; it authored three, deferred three, added one
    evidence update to an existing open proposal rather than competing with it, and performed
    two post-execution audits of its own prior work — one returning NO, which became a
    rule-ineffective re-authoring, and one returning YES.

    ⛔ ITS SINGLE MOST VALUABLE CONTRIBUTION WAS A REFUSAL. On a pattern that had failed three
    consecutive times, it declined to author a fifth ceremony step on the explicit ground that
    doing so would be a SIXTH instance of the category that has now failed four times out of
    four. It folded the item onto an existing proposal instead, with a distinction that was in
    nobody's handoff and is load-bearing: the other failures in that class produce NO artifact,
    which an existence check catches, whereas this one produces every artifact correctly and
    what was skipped is a READ OF A LEDGER, which leaves no trace at all. Built as an existence
    check it would have reported the surface as governed while covering none of the measured
    recurrences. The correct predicate is a QUEUE DRAIN.

    All three authored proposals were ruled by the operator this cycle and then PARKED to the
    improvement backlog by explicit instruction, so that the ritual could finish before any
    build began. Their backlog entries carry the rulings, the carried constraints and the
    honest costs, with the gate field written as decision-CLEARED rather than left null —
    because a null gate conflates no-gate-exists with gate-has-been-cleared, which is itself
    one of this cycle's deferred findings.

    ⚠️ One defect found in a proposal's own structure, and by the operator rather than by any
    check: its recommended-option tag contradicted its own accept gate, marking one option as
    recommended while the gate and the surrounding argument both pointed at another. The
    orchestrator relayed both without noticing they disagreed — an internal-contradiction check
    that needs no access to any artifact and should run before any relay.

