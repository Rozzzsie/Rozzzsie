    Scores the LOOP, not the absence of failure. Six instruments used to conduct this retro
    returned a confident wrong answer: a card-delimiter matcher that returned 4 against roughly
    1,757; a windowed reduction whose heading anchor returned zero against a corpus with at
    least eight heading grammars; the dispatch count central to finding 1.1; an inherited size
    figure ten points off; a test-selection pattern that returned zero selected and was briefly
    read as evidence; and a verification predicate that tested presence where assertion was
    meant. NOT ONE WAS CAUGHT BY REVIEW — the third consecutive cycle in which the review layer
    has failed to catch this class, which is itself the finding.

    ⛔ FOUR OF SIX WERE CAUGHT BY CONTRADICTION rather than by a control, and that arm is broken
    out separately here for the first time because it keeps outperforming the controls. A
    contradiction between an instrument's output and one fact known about the same object
    WITHOUT that instrument requires no source-reading and no tooling. The two conventional
    control catches both came from deliberately constructing a case the instrument should fail.

    ⚠️ A CONTROL CAN PASS VACUOUSLY, and one did this cycle: a negative control for the new
    enforcement arm was green because every case it exercised returned before reaching the code
    under test. A control validates the instrument only if it reaches it.

