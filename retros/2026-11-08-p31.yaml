meta_finding: >-
  Every defect this cycle was found either by an internal contradiction between two of my own
  figures or by a control I built on purpose, and none by an alarm. Nine measurement predicates
  were wrong, each bounded differently, and every rule that would have caught them was already
  written down; the discriminator was not knowledge but the moment of checking, since each wrong
  predicate sat in a verification step written quickly because the subject it checked had already
  been verified slowly. The cycle's sharpest structural lesson came from the coverage block the
  last retro criticised for carrying stale counts. Re-deriving three such counts produced a natural
  experiment. Two disagreed with their published history. The one whose members the prior cycle had
  written down was adjudicated in a single read, because comparing members rather than counts showed
  at once which member my matcher had dropped, and the defect turned out to be mine. The one whose
  members had never been published cannot be adjudicated at all, in either direction, by anyone
  including its author. A count without its members is not a measurement anybody can inherit. The
  rule that follows is to publish the members and let the count be derived, and where the list is
  too large for that, to publish the unit and the matcher so the next cycle can reproduce the figure
  instead of trusting it.

findings:
  - id: p31-1
    title: The response-marker graded share fell for a third straight cycle and the cause is turn size, not discipline
    category: metric-reframe
    evidence_count: 3
    source_catchment: the hook-fire audit, then reconciled against the gate's own per-turn counter
    recommendation: reframe
    status: carried-open
    execution_target_week: '2026-11-15'
    target_surface: the open row tracking the marker's coverage
    detail_ref: >-
      The share of turns the marker grades has fallen across three cycles, from fifty-two per cent
      to forty-five to thirty-eight. Read alone that looks like a collapsing discipline. Held
      against the gate's own counter it is not: the graded count is almost flat across the three
      cycles while the total turn count rose by about fifteen per cent, so the denominator grew and
      the numerator did not. Per-turn compliance inside the graded set is ninety-four per cent. The
      open row described this as a grading collapse and that framing is withdrawn. What is actually
      drifting is the distance between the ruled unit, which is the turn, and the thing the marker
      samples, which is the turn's tail. Longer agentic turns put more work behind each sample.

  - id: p31-2
    title: A dispatch counter counted its own governance documentation, and auditing it inflated the count
    category: instrument-defect
    evidence_count: 1
    source_catchment: the metrics tally, caught by contradiction against a figure measured an hour earlier
    recommendation: fix
    status: carried-open
    execution_target_week: null
    target_surface: the tally's validator-dispatch arm
    detail_ref: >-
      The arm reported five hundred and fourteen dispatches of one validator against seven of its
      peer, which could not hold beside a figure measured an hour earlier in the same cycle. The
      matcher counts the validator's command name in any transcript record, and the rules file
      naming that command is re-injected on every tool call, so five hundred and twelve of the
      matches were injected documentation. The remaining two were sentences written while auditing
      the matcher. The figure moved from five hundred and eight to five hundred and fourteen inside
      one turn for that reason alone. This is the fourth published cycle with the arm unfixed, and
      the false count grows with the governance text that causes it, so it will not wash out. The
      published figure in this sidecar is hand-corrected to two, counted by receipt line. A named
      obstacle to the owed fix: its positive control may be unconstructible, because both forms of
      the counted command are barred from model invocation, so the only producer is the operator
      typing one by hand.

  - id: p31-3
    title: A routing census over-reported silent routings by nine because it accepted one punctuation form and the corpus uses two
    category: instrument-defect
    evidence_count: 1
    source_catchment: the routing census, caught by reading the matcher against the corpus
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-11-15'
    target_surface: the census script's routing-line constant
    detail_ref: >-
      The census keys on a routing line ending in a colon. Twenty-four of a hundred and forty-two
      routing lines across the store end in a period instead. Those rows were read as carrying no
      routing judgement at all, so the reported count of silent routings against a non-empty
      candidate list was over-reported by nine. The true figure is published as a bound rather than
      a point, at fourteen or fewer of fifty-four, because the corrected pass was not re-run over
      the whole store. The defect returned a plausible non-zero, so no zero-keyed tripwire fired.

  - id: p31-4
    title: The consultant rail is forty-one days cold and its metrics are not computable for a fourth window
    category: instrument-liveness
    evidence_count: 4
    source_catchment: the dispatch ledger
    recommendation: accept
    status: approved
    execution_target_week: null
    target_surface: the consultant rail's metric block
    detail_ref: >-
      Zero dispatches in the window, the newest forty-one days old, and a fourth consecutive window
      at zero. All six of its metrics have a zero denominator and are not computable rather than
      zero. On the operator's reading no structural decision arose this cycle, so the zero measures
      demand correctly and is not a failure to dispatch. Recorded so that the next cycle reading
      four consecutive zeroes does not treat the rail as broken.

  - id: p31-5
    title: Six recurrence values crossed the promotion threshold in one cycle
    category: class-recurrence
    evidence_count: 6
    source_catchment: the recurrence census over the capture corpus
    recommendation: fix
    status: approved-queued
    execution_target_week: null
    target_surface: a new backlog row per value
    detail_ref: >-
      Coalescing the corpus's recurrence pointers to distinct subjects left six values at or above
      the promotion threshold, the largest at nine. The operator ruled a mechanism per value rather
      than one combined rule, and filed the set for a dedicated build session rather than this one.
      Counted after coalescing seven twin pairs, so the raw pointer count overstates the subject
      count by those pairs.

  - id: p31-6
    title: A release-condition sweep pattern-matched phrases it predicted and returned a false absence on a met gate
    category: instrument-defect
    evidence_count: 1
    source_catchment: the release-condition sweep, caught by enumerating rows instead of grepping them
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-11-15'
    target_surface: the sweep's row-selection step
    detail_ref: >-
      The sweep looks for cycle-keyed phrases it expects a parked row to carry. A row is filed under
      the symptom that occasioned it, while the sweep searches under the remedy currently being
      shipped, so the mismatch is systematic rather than random and widens the longer a row stays
      open. One row's release condition was in fact met and the sweep reported it absent. The
      direction leaves a phantom obligation standing. The remedy is to enumerate the rows through
      the consumer's own functions and read them, since an enumeration has no vocabulary to miss on.

  - id: p31-7
    title: Two entries were authored, promoted and folded inside one uncommitted change, so the one-way gate refused the fold
    category: ordering-defect
    evidence_count: 2
    source_catchment: the commit-boundary gate, which blocked the close
    recommendation: accept
    status: executed
    execution_target_week: '2026-11-08'
    target_surface: none; the ordering clause already existed
    detail_ref: >-
      A history band accepts an entry only as a byte-identical move of what the committed tree
      already holds. Two entries were written, given a promotion field and folded in a single
      uncommitted change, so the band received them as edited text rather than as moves and the gate
      refused. Six older entries in the same fold passed, because the committed tree held theirs.
      The ritual's own step already carries the two-commit ordering that prevents this, promotions
      first and the fold second, so this was a miss rather than a gap in the doctrine. Resolved by
      committing the promotions, after which the gate returned clean over all nine touched files.
      Worth recording because the first instinct was to undo the fold, which would have edited a
      band to repair a sequencing error.

  - id: p31-8
    title: A count reconciles with its history exactly when the members behind it were published, and one of two was not
    category: measurement-architecture
    evidence_count: 2
    source_catchment: this sidecar's authoring step, re-deriving the counts the last cycle flagged as carried
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-11-15'
    target_surface: the coverage block's unit notes
    detail_ref: >-
      The last cycle's fifth finding was that a gate's check count had been carried for five cycles
      after a row said to re-derive it. Re-deriving this cycle's three counts produced a clean
      natural experiment about why that matters. The ritual's step count first came out at sixteen
      against a published seventeen. It reconciled in one read, because the prior cycle had
      published its full label list, and comparing members rather than counts showed at once which
      label my matcher had dropped: one step carries a letter suffix and my pattern admitted only
      digits and decimals. That count was mine to fix, not the record's. The commit-boundary arm
      count comes out at nineteen distinct validators against a published seventeen and did not
      reconcile, because no cycle published that list. The prior cycle justified its figure by the
      hook's commit history rather than by counting, on the premise that the hook had not changed
      since early October; that premise was false at publication, since a commit landed on the
      publication date itself. Inspected, that commit touched no validator invocation, so arm
      membership genuinely did not change, but the arithmetic still does not close and there is
      nothing to compare member by member. The gate's check count re-derived to the same eighteen,
      now measured rather than inherited. So of three carried counts, the one with published members
      was adjudicated in minutes, the one without cannot be adjudicated at all, and the third
      happened to be right. The rule is to publish the members, or failing that the unit and the
      matcher, which is what this sidecar now does for all three. The three exit-criteria figures
      carried for several cycles are published here as unmeasured rather than carried again.

  - id: p31-9
    title: Nineteen commit-boundary arms resolve, seventeen run unconditionally, and two are gated on a possibly-empty input set
    category: enforcement-coverage
    evidence_count: 2
    source_catchment: this sidecar's authoring step
    recommendation: fix
    status: carried-open
    execution_target_week: '2026-11-15'
    target_surface: the two guarded arms
    detail_ref: >-
      Every one of the nineteen validator paths named by the commit-boundary hooks resolves on disk,
      so none is an absent guard. Two are wrapped in a condition on a staged-file set that can be
      empty: one runs only when a particular state file is staged, the other only when a subject
      array is non-empty. A check whose trigger input set is empty is not a check that passed, and
      at the exit code the two are identical, so each owes a record of how often its input was
      empty. Neither currently keeps one. Found only because a same-line matcher for guards returned
      nothing and a positive control showed the file holds a hundred and seventy-four conditionals,
      which meant the matcher was looking in the wrong place rather than finding an absence.

  - id: p31-10
    title: A memory index is over its park threshold and within a thousand bytes of its loader's truncation cap
    category: release-condition-met
    evidence_count: 1
    source_catchment: the release-condition sweep
    recommendation: surface
    status: deferred
    execution_target_week: null
    target_surface: the memory index
    detail_ref: >-
      The index is a kilobyte over the threshold its parked row named as the release condition, and
      roughly seven hundred bytes under the loader's head-first truncation cap, past which entries
      are silently not recalled. The park is therefore released. No automatic action was taken and
      none should be: the standing rule is that an entry leaves only when it is wrong or superseded
      and the operator has confirmed it, that detail moves to topic files rather than being deleted,
      and that splitting precedes pruning. Surfaced as a decision, not executed.

  - id: p31-11
    title: A subshell guard's reconsideration trigger is met, at two displaced calls in one session
    category: release-condition-met
    evidence_count: 2
    source_catchment: a transcript sweep over the window
    recommendation: surface
    status: deferred
    execution_target_week: null
    target_surface: the guard's open row
    detail_ref: >-
      The guard has fired roughly six hundred times over its lifetime and a hundred and forty-five
      times in this window. Parsing sixteen thousand shell invocations across a hundred and
      sixty-six transcripts found eighteen genuine subshell forms, of which two carried the
      construct the guard refuses, both in one session on one day, with four refusals strictly
      preceding them. The row's trigger for reconsidering the refusal is therefore met and the
      decision is the operator's. One correction of record: the first pass of this measurement read
      a record field that does not exist on those records, defaulting every timestamp to empty, and
      manufactured the ordering result. The corrected pass agreed with it by luck.

  - id: p31-12
    title: A ledger's header mandates a token discipline its own predicate does not implement
    category: convergence-gap
    evidence_count: 1
    source_catchment: the proposal-ledger audit
    recommendation: fix
    status: carried-open
    execution_target_week: null
    target_surface: the ledger's status predicate
    detail_ref: >-
      The ledger's header states that a superseded status token is split rather than left compound.
      Its predicate does not implement that: a compound token appears forty-six times across a
      hundred and seven blocks, and of a hundred and one status lines only sixteen lead with a
      capitalised token at all. The composition of header and predicate is what fails, so neither
      read alone shows a defect. Filed as a row rather than fixed here, because the repair changes
      how every historical block reads and that is a disposition the operator holds.

  - id: p31-13
    title: A receipt arm is keyed on tool name, so any write performed through the shell bypasses it silently
    category: mechanism-gap
    evidence_count: 1
    source_catchment: the commit-boundary gate, which blocked on a missing receipt
    recommendation: accept
    status: partial-executed
    execution_target_week: null
    target_surface: the receipt arm
    detail_ref: >-
      The arm requires a drift-scan receipt for the staged content. The scan that produces one is
      triggered by tool name, so a write made through the shell never reaches it, and three states
      are indistinguishable at the gate: no scan ran, a scan ran and failed to persist, or a scan
      ran and stored a verdict for different content. Diagnosed to the third by reading the fire
      log for provenance and verdict pairs, then cleared by making a genuine tool write so a real
      receipt existed for the staged blob. A hook chain keyed on a tool is keyed on a mechanism and
      not on an effect, and the set of ways to write a file is open.

  - id: p31-14
    title: An absolute novelty claim in a prior finding was false at ten
    category: correction
    evidence_count: 1
    source_catchment: self, while re-reading the claim before carrying it forward
    recommendation: correct
    status: executed
    execution_target_week: '2026-11-08'
    target_surface: the claim's own record
    detail_ref: >-
      A prior finding stated that a particular marker appears in no stored card. A direct count
      returns ten. The finding's substance holds, since the marker is consumed at capture and is
      near-absent relative to the corpus, and the operative instruction to grep by header rather
      than by marker is unchanged. The absolute is withdrawn and restated as near-absent with the
      measured figure attached. A novelty claim is the one class a reconciliation harness cannot
      test, because every arm verifies a value and none can verify that something is new.

proposal_backlog:
  authored_this_cycle: 2
  deferred_this_cycle: 6
  notes: >-
    The learning agent wrote two proposals and both were approved by the operator and executed this
    cycle. Each closed with a paragraph naming the bounds it could not clear, and clearing all four
    of those bounds before executing produced two corrections and two confirmations, with both
    corrections sitting inside the flagged bounds. One was a false premise: the agent had taken a
    cited section's subject from a neighbouring pointer rather than from the section, and captured
    one of its two arms. The other was a routing conclusion rather than a citation: a rider about
    misreading a passing result had been routed only from the act of building the instrument, not
    from the act of reading its output, so it would have been unreachable at the moment of use. The
    routing table was widened in the same edit that shipped the rider. Six items were deferred; four became
    backlog rows.

