defect_ledger:
  open_total: 127
  live: 123
  parked: 4
  age_under_7d: 12
  age_7_to_29d: 3
  age_30d_plus: 112
  age_undated: 0
  median_age_days: 72
  max_age_days: 106
  measured_at: '2026-11-08'
  measured_from: the operational state file, rendered through all three of its consumer functions
  notes: >-
    Open rows rose from one hundred and fifteen to one hundred and twenty-seven. The parked count did NOT
    move: it was four last cycle and is four now. Ownership splits as ninety-four to the orchestrator,
    twenty-nine needing an operator decision, and four parked, which sums to the total. Every row carries
    a date, so no row's age is unknown. THREE FIGURES IN THIS NOTE WERE WRONG IN AN EARLIER DRAFT OF THIS
    SAME BLOCK AND ARE CORRECTED BEFORE PUBLICATION, because they were prose numbers sitting beside fields
    and were never held against them. The draft said the total had risen to one hundred and twenty-five
    while the field beside it read one hundred and twenty-six; it said the parked share rose from four to
    five, which never happened in either direction; and it carried last cycle's operator-decision figure
    of twenty-seven where the measured value is twenty-nine. The draft's ownership split also omitted the
    parked bucket, so it summed to one hundred and twenty rather than to the total, which is an internal
    contradiction needing no access to the source file to see. PREDICATE, STATED SO THE FIGURE CAN BE
    REPRODUCED. Rows are the qualifying rows of the operational state file's open region, rendered through
    all three of its consumer functions and required to agree; all three return the same total. A row's
    age is taken from the first calendar date anywhere in the row, not from inside its status tag. That
    distinction is load-bearing: ten rows close their emphasis span immediately after the bracket rather
    than after it, so a tag-scoped reader finds no tag and reads those rows as undated. An earlier pass of
    this cycle did exactly that, and would have published ten undated rows and a thirty-day-plus count ten
    lower, overwriting a correct figure with a wrong one under the banner of re-deriving it. CONTROL:
    excluding the single row this cycle added late, the predicate reproduces every one of the earlier
    draft's nine figures exactly, which is the evidence that it matches the producer rather than merely
    disagreeing with it. MEASURED AFTER this cycle's own three row edits rather than before them, so these
    figures and this cycle's findings describe one state: a parked row whose release condition was met
    became a decision row in place rather than a duplicate, one new decision row was added, and one new
    orchestrator-side finding row was added late. The prior-cycle comparison is therefore against a ledger
    this cycle also changed, which is stated rather than smoothed over. This block has no producer script:
    the surface that renders the dashboard knows these key names, but nothing computes them, so every
    value here is derived by hand, and the predicate above is the only thing that lets the next cycle
    check it.

