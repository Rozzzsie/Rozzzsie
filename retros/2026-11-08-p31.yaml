instrument_liveness:
  silent_failures_observed: 9
  caught_by_control: 2
  caught_by_review: 2
  caught_by_contradiction: 5
  notes: >-
    Hand-classified; the arms sum to the total. All nine were my own measurement predicates, found
    while authoring this retro. By contradiction: a tag matcher that read only records carrying one
    field and under-counted by a fifth; the routing census punctuation variant; a backlog count
    whose own arithmetic did not close; an absolute novelty claim refuted by a direct count; and a
    record field that does not exist on the records read, which defaulted silently and manufactured
    an ordering result. By control: a guard matcher whose empty result was shown to be mislocated
    rather than absent, and the path-for-text call whose zero was reproduced on demand. By review: a
    check-header matcher whose three zeroes were explained only by reading the file's comment style,
    and a step-label matcher that dropped a letter-suffixed label and would have published a wrong
    count as a headline finding had the prior cycle's own record not been read first. None was
    caught by an alarm. Seven of the nine returned a plausible result rather than an error, and
    three of those read in the flattering direction.

detection_provenance:
  caught_by_control: 0
  caught_by_operator: 1
  caught_by_accident: 0
  instrumented_from: p18
