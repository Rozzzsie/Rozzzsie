discipline_metrics:
  ritual_steps_defined: 17
  ritual_steps_completed: 17
  monthly_subritual_due: false
  monthly_subritual_completed: null
  quality_gate_traces_sampled: 70
  quality_gate_traces_passing: 70
  response_marker_missed_turns: 14
  response_marker_graded_turns: 215
  response_marker_blocking_fires: 200
  response_marker_miss_rate: 0.065
  response_marker_measured_at: '2026-11-08'
  response_marker_note: >-
    The blocking figure is a count of hook fires, not of turns. Every fire in a long agentic turn
    re-grades the same last-completed turn, so fires exceed graded turns by design and the two
    numbers answer different questions. It is published beside the turn counts rather than in place
    of them, and should not be compared against a prior cycle's figure unless that figure is known
    to count the same unit. The fires split across two action classes, absent and malformed, which
    are separate keys on separate turns. The miss rate is on the graded denominator.
  intent_confirmation_skip_rate: 0.0
  notes: >-
    Step count re-derived this cycle, excluding the five-step monthly sub-ritual that follows as its own list.
    Seventeen, matching the prior cycle. A first matcher returned sixteen because it admitted only digit and
    decimal labels while one step carries a letter suffix; the error was caught by reading the prior cycle's
    own record, which had published the full label list, so comparing members rather than counts located the
    missing label in a single read. The labels are 1, 2, 3, 4, 5, 5.5, 6, 6b, 6.5, 6.7, 6.8, 6.9, 7, 7.5, 8,
    9, 10. Completion was written at the publication step, after its entry gate passed as three acts rather
    than as intentions: the artifact resolved on disk, the private close cascade showed at the head of the
    log, and the state paths read clean. Seventeen, with a per-label derivation in the artifact so a reader
    can check it rather than take it. One act inside a label is a skip the protocol sanctions, the public
    narrative companion, which no cycle has authored since May; it is a sub-step of a label rather than a
    label, so it does not reduce the count, and counting sub-steps against a denominator made of labels is a
    named prior error here. The figure still forecasts exactly one act, the public push, and reverts to null
    if that push does not land. The monthly sub-ritual is not due because a retro already ran this calendar
    month, so today's run is not the month's first; the pass itself was confirmed to have run on that earlier
    date by checking directly, because the not-due signal cannot distinguish a cycle that ran it from one that
    skipped it. The intent-confirmation skip rate is zero but vacuous rather than clean: the explicit skip
    marker it counts appears zero times in the window, so the arm has no positive instance and returns zero
    whether or not skipping occurred. The adjacent measurable is that ten of forty-seven sessions carry no
    intent line at all, which is twenty-one per cent and under the flag threshold. The loop-detection markers
    are vacuous for the same reason. Trace sampling covered every trace block committed in the window rather
    than a sample, and none failed.

