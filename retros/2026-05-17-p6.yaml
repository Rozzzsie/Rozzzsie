# [CORRECTED 2026-07-15] CORRECTION NOTICE — this cycle's subagent Edit-permission item is FALSE.
# The permission fix this cites never worked. Every rule in the settings allowlist used a single-leading-slash absolute path, which Claude Code anchors at the settings source rather than the filesystem root, so the rules resolved to paths that cannot exist. Both the 2026-05-10 Write rules and the 2026-05-17 Edit rules were inert; subagent grants were dead from 2026-05-10 to 2026-07-15 (66 days). The failure was invisible because a dead allow-rule does not error, it degrades to a permission prompt approved by hand. Corrected and verified 2026-07-15 by a three-arm probe (granted path allowed / ungranted control denied / counterfactual single-slash denied).
# The 'Write axis closed / Edit axis missed' model does not exist: the tool name was a red herring and the path syntax was the whole bug.
# This item is also reclassified OUT of the helper-axis-completeness family, which it fails on that family's own predicate
# (the member-set was complete; it simply could not match). Full account: the 2026-07-15 entry in the private repo's root LEARNINGS.md.

