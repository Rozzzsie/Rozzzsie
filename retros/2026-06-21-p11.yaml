# Meta-finding — the renderer's hero callout. The cycle's one-line lesson.
meta_finding:
  headline: "A substrate change repurposed an artifact from disposable to load-bearing — and silently turned an old maintenance mechanism into a corruptor. Last cycle a promotion-gate began deriving promotion-eligibility (evidence-mass, recurrence) as a pure function of the live signal buffer, making that buffer the live evidence corpus rather than a disposable firehose. The legacy date-based rotation (and the SessionStart banner that still suggests it) predate the change; running it would shrink the gate's inputs and silently blind it. The orchestrator walked into the stale banner instruction; the OPERATOR caught it and refused the rotation. Named the STALE-MECHANISM class: a substrate change that flips an artifact disposable→load-bearing turns every old maintenance mechanism over it into a silent corruptor until each is re-derived against the new contract."

findings:
  # Item A — meta headline: the stale-mechanism catch
  - id: "1.1"
    title: "the legacy date-based buffer rotation is now INCOMPATIBLE with the promotion-gate substrate shipped last cycle — the gate computes evidence-mass + post-promotion recurrence as a PURE FUNCTION of (seed + live buffer), so the buffer is the live evidence corpus, not a disposable firehose. Date-rotation (and the SessionStart staleness banner that still instructs it) would archive real evidence and shrink the gate's inputs, silently blinding it. The orchestrator, following the stale banner, proposed archiving a large date-bounded slice; the operator caught it ('we agreed insights are not rotated by date — why archive these?') and the rotation was SUSPENDED (no archive run). Named the STALE-MECHANISM class. Rotation redesign (families-aware: persist counts before archiving / archive only mechanically-decided families / retire date-rotation entirely) parked to a consultant framing; the staleness banner is queued for re-wording so it stops instructing the wrong remediation."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "session-meta + operator-correction"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-21"
    target_surface: "root LEARNINGS stale-mechanism-class entry + parked families-aware-rotation redesign + staleness-banner re-word (queued)"

  # Item B — the new gate's shadow predicate over-flags domain-scoped families
  - id: "1.2"
    title: "the promotion-gate's promotion-due shadow predicate OVER-FLAGS domain-scoped (non-governance) families — the predicate thresholds on evidence-mass but does NOT filter by family scope, so 2 of 4 flagged families this cycle were domain-scoped, non-promotable-to-governance items. Surfaced as an input to the upcoming enforce-flip review: apply a governance-only-teeth scope filter so the gate's decision queue contains only families eligible for governance promotion. Caught while the gate is still DRY-RUN-dark (emits shadow rows, enforces nothing) — exactly the window the dark phase exists to surface."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "insights-gate-shadow + session-meta"
    recommendation: "watch"
    status: "deferred"
    execution_target_week: "next-cycle"
    target_surface: "promotion-gate governance-only-teeth scope filter (enforce-flip-prep open-item)"

  # Item C — doctrine promotion: event-log outranks same-document rollup
  - id: "2.1"
    title: "PROMOTED to doctrine (learning-layer P1) — 'an event-log / commit-trail outranks a same-document rollup or status-table for any DERIVED or queryable done/not-done answer.' Catalyst: a backlog item was mis-marked done from a closeout plan's status-table while the chronological event log showed its enforcement step was still future — the rollup table led the event log. Rule: when a status-table and an append-only event log disagree on a derived state, the event log wins; verify done-state to the chronological trail, never to a hand-maintained summary that can drift. Sub-family of the standing verify-to-artifact cluster (now 14 sub-families)."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "learning-layer-proposal + LEARNINGS-delta"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-21"
    target_surface: "output-checklist verify-to-artifact cluster — event-log-outranks-rollup sub-family"

  # Item D — doctrine promotion: rebuild the env before domain-debugging after a runtime bump
  - id: "2.2"
    title: "PROMOTED to doctrine (learning-layer P2) — 'after a system runtime (interpreter) upgrade, rebuild the project virtual-env BEFORE domain debugging.' Catalyst: a system package-manager interpreter bump orphaned a project's virtual-env (its installed libraries vanished from the new interpreter), and the resulting import failure masqueraded as a domain/credentials problem — costing a misdirected debug pass. Rule: a runtime version bump is a first-class suspect for any sudden 'library/module not found' across multiple projects; rebuild the env first, then debug the domain."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "learning-layer-proposal + LEARNINGS-delta"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-21"
    target_surface: "output-checklist post-runtime-bump venv-first sub-bullet"

  # Item E — doctrine promotion: question-ending turns are bar-mandatory
  - id: "2.3"
    title: "PROMOTED to doctrine (learning-layer P3) — 'a user-question-ending turn is checkpoint-bar-mandatory regardless of prior tool-call count.' The work that produced a clarifying question is substantive, but such turns fell into the brief-ACK exemption gap when they carried fewer than the tool-call threshold — one of three checkpoint-bar miss-clusters with ZERO prior coverage (the post-compact and tool-batch clusters were already covered by existing heuristics; this one was not). Rule landed in the response-gate doc + the enforced protocol. Frame (a) doctrine shipped; frame (b) hook-level enforcement deferred to a focused pass."
    category: "rule-extension"
    evidence_count: 1
    source_catchment: "learning-layer-proposal + discipline-metric-tally"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-21"
    target_surface: "response-gate bar-mandatory-turns + protocol checkpoint-bar section"

  # Item F — checkpoint-bar miss-rate regressed; ack-gate flip re-dated on corrupt-data grounds
  - id: "4.1"
    title: "checkpoint-bar miss-rate 0.28 cycle-wide (718/2609 substantive turns) — UPWARD/regressing from the prior cycle's 0.22 (trend 0.20 → 0.26 → 0.22 → 0.28). Clusters on post-compact arcs, question-ending turns (the 2.3 fix), and long mutation-heavy build cascades. The structural fix — a PreToolUse acknowledgement-gate that withholds the next mutation until a bar is emitted — exists, but its enforce-flip was RE-DATED later this cycle on a verify-to-artifact basis: the pre-fix shadow-deny calibration data is corrupt (the gate was structurally dead before its mid-month fix, pinning the counter), so only a handful of clean days have accrued, and the high deny volume merely mirrors the live miss-rate. Land the question-ending fix + let the miss-rate fall on clean data first, THEN calibrate the enforce threshold. No new rule (the 2.3 promotion covers the one uncovered cluster)."
    category: "meta-observation"
    evidence_count: 1
    source_catchment: "discipline-metric-tally + session-meta"
    recommendation: "watch"
    status: "deferred"
    execution_target_week: "next-cycle"
    target_surface: "PreToolUse checkpoint-bar acknowledgement-gate (enforce-flip re-dated on corrupt-pre-fix-data grounds)"

  # Item G — self-discipline grader: false silent-candidate from an audit vocab gap
  - id: "5.1"
    title: "the weekly hook fire-rate audit flagged the separate-model self-discipline grader's per-output hook as a SILENT-CANDIDATE at ~70% — verified FALSE. The audit's fire-rate numerator counts a generic verdict vocabulary (pass / block-corrective / educate-only) and is blind to the grader's OWN domain verdict vocabulary, so legitimate grader fires read as silence. Audit-consumer vocabulary gap, not a dead hook — filed as a small-fix candidate (extend the audit numerator to recognize the grader's verdict tokens), watch-tier. Same shape as last cycle's audit-break: the audit instrument mis-reading a healthy hook."
    category: "rule-clarification"
    evidence_count: 1
    source_catchment: "hook-fire-rate-audit + session-meta"
    recommendation: "watch"
    status: "deferred"
    execution_target_week: "next-cycle"
    target_surface: "hook-fire-rate audit numerator — recognize grader-domain verdict vocabulary"

  # Item H — grader timeouts: capability-outgrew-budget recurring after the budget raise
  - id: "5.2"
    title: "the self-discipline grader logged ~24 timeout errors clustered mid-window ('timed out at 100s'), recurring AFTER last month's budget raise from 30s to 100s — a capability-outgrew-budget signal: the grader's workload now exceeds even the raised ceiling on some outputs. Not net-new doctrine; reinforces the parked grader grading+latency backlog item (the grader needs a structural latency fix, not another budget bump). Reported transparently; the timeouts fail-open (a timed-out grade does not block a relay)."
    category: "meta-observation"
    evidence_count: 1
    source_catchment: "hook-fire-rate-audit"
    recommendation: "watch"
    status: "deferred"
    execution_target_week: "backlog"
    target_surface: "parked grader grading+latency backlog item (reinforced, not net-new)"

  # Item I — learning-layer: 3 authored + a prior Write-authority gap RESOLVED
  - id: "6.1"
    title: "the learning-layer agent authored 3 proposals this cycle (P10 step 6.5) — event-log-outranks-rollup (P1 → 2.1), post-runtime-bump venv-first (P2 → 2.2), and question-ending-turn bar-mandatory (P3 → 2.3), ALL accepted + executed; plus 2 deferred (the two governance-gate families dispositioned in seed). Separately RESOLVED: the learning-layer Write-authority gap re-opened last cycle was verified to source as NOT a real gap — the harness grant for both Write and Edit on the proposals file has been live for over a month; the agent's edit succeeded this cycle, and the prior denial was an incidental transient. Verify-to-artifact closed a phantom gap. The orchestrator-persist fallback stays as belt-and-suspenders."
    category: "rule-extension"
    evidence_count: 2
    source_catchment: "learning-layer-proposal + session-meta"
    recommendation: "accept"
    status: "executed"
    execution_target_week: "2026-06-21"
    target_surface: "learning-layer proposals lifecycle + Write-authority-gap RESOLVED (verify-to-artifact)"

