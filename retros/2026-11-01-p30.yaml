  window_session_count: 95
  median_first_tool_latency_sec: 52
  p95_first_tool_latency_sec: 1163
  max_first_tool_latency_sec: 6630
  threshold_sec: 120
  threshold_violations: 21
  notes: >-
    Sessions rose from 92 to 95. The median fell from 55 to 52 seconds and violations from 26 to
    21, while p95 rose from 661 to 1163 seconds. A startup briefing delivered after a first round
    of reads still registers as a slow first tool call, and sessions left open before their first
    call set the tail, so this is not a health signal on its own.

